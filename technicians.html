<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft | TFI Technician Directory & Talent Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-color: #0B0F19;
            --card-bg: #1E293B;
            --accent-gold: #FBBF24;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --border-color: #334155;
            --badge-green: #34D399;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            background-color: #0F172A;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
        }

        .nav-links a {
            color: var(--text-sub);
            text-decoration: none;
            margin-left: 1.2rem;
            font-size: 0.95rem;
            font-weight: 500;
        }

        .nav-links a.active {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .container {
            width: 92%;
            max-width: 1000px;
            margin: 2rem 0;
        }

        .header-title {
            color: var(--accent-gold);
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .header-desc {
            color: var(--text-sub);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .search-box {
            width: 100%;
            max-width: 500px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 1.5rem;
        }

        .search-box:focus {
            border-color: var(--accent-gold);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1rem;
        }

        .tech-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            transition: transform 0.2s, border-color 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .tech-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-gold);
        }

        .tech-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--accent-gold);
            margin-bottom: 0.3rem;
        }

        .craft-tag {
            display: inline-block;
            background-color: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .tech-bio {
            color: var(--text-sub);
            font-size: 0.88rem;
            line-height: 1.4;
            margin: 0;
        }

        .verified-badge {
            margin-top: 0.8rem;
            font-size: 0.75rem;
            color: var(--badge-green);
            font-weight: 600;
        }

        @media (max-width: 600px) {
            nav { padding: 1rem; }
            .header-title { font-size: 1.4rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">TeluguCineCraft</a>
        <div class="nav-links">
            <a href="index.html">Movies</a>
            <a href="technicians.html" class="active">Talent Directory</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="header-title">TFI Craft & Technician Directory</h1>
        <p class="header-desc">Discover verified TFI talent across all crafts—from visionaries to unsung behind-the-scenes crew members.</p>

        <input type="text" id="techSearch" class="search-box" placeholder="Search technician by name or craft (e.g., Director, Stunts, DOP)..." oninput="filterTechs()">

        <div class="grid" id="techGrid">
            <p style="color:var(--text-sub);">Loading technicians index...</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://eosgvjvpdwxmpxzerxit.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx";
        let allTechs = [];

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, function(tag) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag;
            });
        }

        document.addEventListener("DOMContentLoaded", async function() {
            if (typeof supabase !== 'undefined') {
                const { createClient } = supabase;
                const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                const { data: techs } = await supabaseClient.from('technicians').select('*');
                allTechs = techs || [];
                renderTechs(allTechs);
            }
        });

        function renderTechs(list) {
            const techGrid = document.getElementById('techGrid');
            if (list && list.length > 0) {
                techGrid.innerHTML = list.map(t => `
                    <a href="technician.html?id=${t.id}" class="tech-card">
                        <div class="tech-name">${escapeHTML(t.name)}</div>
                        <span class="craft-tag">${escapeHTML(t.craft)}</span>
                        <p class="tech-bio">${escapeHTML(t.bio || 'Verified TFI Technician.')}</p>
                        <div class="verified-badge">✓ Verified TFI Index</div>
                    </a>
                `).join('');
            } else {
                techGrid.innerHTML = `<p style="color:var(--text-sub); grid-column:1/-1;">No technicians found matching your search.</p>`;
            }
        }

        function filterTechs() {
            const q = document.getElementById('techSearch').value.toLowerCase();
            const filtered = allTechs.filter(t => 
                (t.name && t.name.toLowerCase().includes(q)) ||
                (t.craft && t.craft.toLowerCase().includes(q))
            );
            renderTechs(filtered);
        }
    </script>
</body>
</html>
