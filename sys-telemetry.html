<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Command Vault | TeluguCineCraft</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

    <style>
        :root {
            --bg-base: #020408;
            --bg-card: rgba(14, 19, 30, 0.9);
            --border-glass: rgba(255, 255, 255, 0.08);
            --gold-accent: #FFC700;
            --cyan-accent: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --danger: #EF4444;
            --success: #22C55E;
            --verified-blue: #1DA1F2;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }

        body {
            background-color: var(--bg-base); color: var(--text-main);
            min-height: 100vh; padding: 1.5rem;
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.03) 0%, transparent 60%);
        }

        .container { max-width: 1500px; margin: 0 auto; }

        /* EXECUTIVE TOP NAV */
        .admin-nav {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-card); border: 1px solid var(--border-glass);
            padding: 1rem 2rem; border-radius: 16px; margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: sticky; top: 1rem; z-index: 100;
        }
        .nav-title { font-size: 1.2rem; font-weight: 900; color: #FFF; display: flex; align-items: center; gap: 10px; }
        .nav-title i { color: var(--gold-accent); }
        .nav-actions { display: flex; align-items: center; gap: 15px; }
        .nav-btn { background: rgba(0,0,0,0.4); border: 1px solid var(--border-glass); color: #FFF; padding: 8px 15px; border-radius: 8px; font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: all 0.2s; position: relative; display: flex; align-items: center; gap: 8px;}
        .nav-btn:hover { border-color: var(--cyan-accent); color: var(--cyan-accent); }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: var(--danger); color: #FFF; font-size: 0.6rem; padding: 2px 6px; border-radius: 10px; display: none; }

        /* GLOBAL BROADCASTER */
        .broadcaster-module { background: linear-gradient(145deg, var(--bg-card) 0%, rgba(6,8,12,0.9) 100%); border: 1px solid var(--gold-accent); border-radius: 16px; padding: 2rem; margin-bottom: 2rem; box-shadow: 0 10px 40px rgba(255,199,0,0.1); }
        .broadcaster-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem; align-items: start; }
        .admin-input { background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); color: #FFF; border-radius: 8px; outline: none; width: 100%; padding: 12px; margin-top: 5px; font-size: 0.85rem;}
        .admin-input:focus { border-color: var(--gold-accent); }
        .btn-lock { background: linear-gradient(135deg, var(--gold-accent), #E6B300); color: #000; border: none; padding: 1rem; border-radius: 8px; font-weight: 900; cursor: pointer; text-transform: uppercase; width: 100%; transition: transform 0.2s;}

        /* DASHBOARD LAYOUT */
        .dashboard-layout { display: grid; grid-template-columns: 380px 1fr; gap: 2rem; align-items: start; }

        /* ALGORITHMIC OVERRIDE CARD */
        .override-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 16px; padding: 1.5rem; border-top: 3px solid var(--danger); box-shadow: 0 10px 30px rgba(0,0,0,0.6); }

        /* QUEUES GRID */
        .queues-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
        .queue-container { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 16px; padding: 1.5rem; display: flex; flex-direction: column; max-height: 400px; }
        .queue-header { color: #FFF; margin-bottom: 15px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-glass); padding-bottom: 10px;}
        .queue-list { overflow-y: auto; flex: 1; padding-right: 5px; }
        
        .q-card { background: rgba(0,0,0,0.4); border: 1px solid var(--border-glass); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
        .q-title { font-size: 0.9rem; font-weight: 800; color: #FFF; margin-bottom: 4px; }
        .q-meta { font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px; }
        .action-group { display: flex; gap: 8px; margin-top: 10px; }
        .action-btn { flex: 1; padding: 6px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; cursor: pointer; border: none; text-transform: uppercase; text-align: center; }
        .btn-approve { background: var(--success); color: #000; }
        .btn-reject { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
        .btn-blue { background: var(--verified-blue); color: #FFF; }

        /* MODALS (INBOX & DIRECTORY) */
        .modal-overlay { position: fixed; inset: 0; background: rgba(2,4,8,0.9); backdrop-filter: blur(10px); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 2rem; }
        .modal-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 20px; width: 100%; box-shadow: 0 20px 50px rgba(0,0,0,0.9); position: relative; display: flex; flex-direction: column; overflow: hidden;}
        .modal-close { position: absolute; top: 1.2rem; right: 1.5rem; background: none; border: none; color: var(--text-muted); font-size: 1.5rem; cursor: pointer; z-index: 10;}
        
        /* EMAIL-STYLE INBOX UI */
        .inbox-layout { display: grid; grid-template-columns: 350px 1fr; height: 70vh; }
        .inbox-list { border-right: 1px solid var(--border-glass); overflow-y: auto; background: rgba(0,0,0,0.2); }
        .inbox-item { padding: 15px; border-bottom: 1px solid var(--border-glass); cursor: pointer; transition: background 0.2s; }
        .inbox-item:hover, .inbox-item.active { background: rgba(56, 189, 248, 0.1); border-left: 3px solid var(--cyan-accent); }
        .inbox-item-title { font-weight: 800; color: #FFF; font-size: 0.9rem; margin-bottom: 5px; }
        .inbox-item-preview { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .inbox-reading-pane { padding: 2rem; overflow-y: auto; background: var(--bg-card); }

        /* DIRECTORY SEARCH UI */
        .dir-result-card { background: rgba(0,0,0,0.4); border: 1px solid var(--border-glass); padding: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;}

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="container" id="adminContainer">
        <!-- Auth Check Placeholder -->
    </div>

    <!-- INBOX MODAL -->
    <div class="modal-overlay" id="inboxModal">
        <div class="modal-card" style="max-width: 1200px;">
            <button class="modal-close" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
            <div style="padding: 1.5rem 2rem; border-bottom: 1px solid var(--border-glass); background:rgba(0,0,0,0.5);">
                <h2 style="color:var(--cyan-accent);"><i class="fa-solid fa-envelope"></i> Executive Secure Inbox</h2>
                <p style="font-size:0.8rem; color:var(--text-muted);">Direct communications and support tickets from the Arena.</p>
            </div>
            <div class="inbox-layout">
                <div class="inbox-list" id="inboxListArea">
                    <div style="padding:2rem; text-align:center; color:var(--text-muted);">Loading secure messages...</div>
                </div>
                <div class="inbox-reading-pane" id="inboxReadingArea">
                    <div style="display:flex; height:100%; align-items:center; justify-content:center; color:var(--text-muted); flex-direction:column; gap:10px;">
                        <i class="fa-solid fa-inbox fa-3x"></i>
                        <p>Select a message to read</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- DIRECTORY & SEND DM MODAL -->
    <div class="modal-overlay" id="directoryModal">
        <div class="modal-card" style="max-width: 800px; padding: 2rem;">
            <button class="modal-close" onclick="closeModals()"><i class="fa-solid fa-xmark"></i></button>
            <h2 style="color:var(--gold-accent); margin-bottom:10px;"><i class="fa-solid fa-address-book"></i> Global User Directory & Dispatch</h2>
            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:20px;">Search active users to issue official Admin Direct Messages or fetch User IDs for Campaign Overrides.</p>
            
            <div style="display:flex; gap:10px; margin-bottom: 20px;">
                <input type="text" id="dirSearchInput" class="admin-input" style="margin:0;" placeholder="Search Handle or Name... (e.g., RebelKing)">
                <button class="btn-lock" style="width:150px; padding:0;" onclick="searchDirectory()"><i class="fa-solid fa-search"></i> Search</button>
            </div>
            
            <div id="dirResultsArea" style="max-height: 250px; overflow-y:auto; margin-bottom: 20px; border-bottom: 1px solid var(--border-glass); padding-bottom:10px;">
                <!-- Results inject here -->
            </div>

            <div style="background:rgba(0,0,0,0.3); padding:15px; border-radius:12px; border:1px solid var(--border-glass);">
                <h4 style="color:var(--cyan-accent); margin-bottom:10px; font-size:0.9rem;">Dispatch Official Message</h4>
                <input type="text" id="dmTargetId" class="admin-input" placeholder="Paste Target User ID here..." style="margin-bottom:10px;">
                <textarea id="dmMessageBody" class="admin-input" rows="3" placeholder="Type official administrative dispatch..." style="margin-bottom:10px;"></textarea>
                <button class="btn-lock" style="background:var(--cyan-accent);" onclick="dispatchAdminDM()"><i class="fa-solid fa-paper-plane"></i> Dispatch to User</button>
            </div>
        </div>
    </div>

    <script>
        const MASTER_ADMIN_EMAIL = "therealexplorer123@gmail.com";
        let liveSyncActive = false;
        let globalSupportTickets = [];

        async function verifyAdminVault() {
            try {
                const { data: { session }, error } = await db.auth.getSession();
                const container = document.getElementById('adminContainer');

                if (error || !session || !session.user || session.user.email !== MASTER_ADMIN_EMAIL) {
                    container.innerHTML = `
                        <div class="lockdown-screen">
                            <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: var(--danger); margin-bottom: 15px;"></i>
                            <h2 style="color:#FFF; font-size:1.4rem; font-weight:900; margin-bottom:10px;">VAULT LOCKED</h2>
                            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:20px;">Authenticate with master credentials to unlock.</p>
                            <button class="btn-admin-login" onclick="db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } })">
                                <i class="fa-brands fa-google"></i> Authenticate Master Access
                            </button>
                        </div>
                    `;
                    return;
                }
                renderAdminDashboard(session.user);
                initRealtimeSync(); 
            } catch (err) { console.error("Vault verification error:", err); }
        }

        function renderAdminDashboard(user) {
            document.getElementById('adminContainer').innerHTML = `
                <nav class="admin-nav">
                    <div class="nav-title"><i class="fa-solid fa-server"></i> Executive Command Vault</div>
                    <div class="nav-actions">
                        <button class="nav-btn" onclick="openDirectory()"><i class="fa-solid fa-search"></i> User Directory</button>
                        <button class="nav-btn" onclick="openInbox()">
                            <i class="fa-solid fa-envelope"></i> Secure Inbox
                            <span id="inboxBadge" class="notif-badge">0</span>
                        </button>
                        <div style="color:var(--success); font-weight:800; font-size:0.75rem; border:1px solid var(--success); padding:6px 12px; border-radius:8px; background:rgba(34,197,94,0.1);">
                            <i class="fa-solid fa-satellite-dish"></i> TELEMETRY LIVE
                        </div>
                        <button class="nav-btn" style="border-color:var(--danger); color:var(--danger);" onclick="db.auth.signOut().then(() => window.location.reload())">Lock Vault</button>
                    </div>
                </nav>

                <!-- GLOBAL BROADCASTING HUB -->
                <div class="broadcaster-module">
                    <h3 style="color:var(--gold-accent); margin-bottom: 8px; font-size: 1.2rem;"><i class="fa-solid fa-bullhorn"></i> Global Broadcasting Hub</h3>
                    <p style="font-size:0.85rem; color:var(--text-muted); margin-bottom:20px;">Deploy critical platform news or official Box Office polls directly to the top of the Arena feed.</p>
                    
                    <div class="broadcaster-grid">
                        <div>
                            <textarea id="adminPostContent" class="admin-input" rows="4" placeholder="Draft official executive dispatch..."></textarea>
                        </div>
                        <div>
                            <div style="padding: 10px; background:rgba(0,0,0,0.4); border:1px dashed var(--gold-accent); border-radius:8px; margin-bottom: 10px;">
                                <label style="font-size:0.7rem; color:var(--gold-accent); font-weight:800; text-transform:uppercase;"><i class="fa-solid fa-square-poll-vertical"></i> Official Poll Options</label>
                                <input type="text" id="adminPoll1" class="admin-input" placeholder="Option 1 (e.g., Spirit)" style="margin-bottom:5px; padding:8px;">
                                <input type="text" id="adminPoll2" class="admin-input" placeholder="Option 2 (e.g., SSMB29)" style="padding:8px;">
                            </div>
                            <button class="btn-lock" onclick="broadcastAdminPost('${user.id}')"><i class="fa-solid fa-satellite-dish"></i> Execute Broadcast</button>
                        </div>
                    </div>
                </div>

                <div class="dashboard-layout">
                    <!-- LEFT: STEALTH MARKETING ENGINE -->
                    <div class="override-card">
                        <h3 style="color:var(--danger); margin-bottom: 8px;"><i class="fa-solid fa-bolt"></i> Stealth Marketing Engine</h3>
                        <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:20px; line-height:1.5;">Execute high-value producer campaigns. Monetize the platform by injecting artificial metrics, forcing movies to #1, or injecting fake post likes.</p>
                        
                        <label style="font-size:0.7rem; color:var(--text-muted); font-weight:800; text-transform:uppercase;">Campaign Execution Target</label>
                        <select id="promoType" class="admin-input" style="margin-bottom:15px;">
                            <option value="movie_hype">Boost Movie / Hype (Index Page)</option>
                            <option value="hero_boost">Boost Hero / Faction (Index Page)</option>
                            <option value="hashtag">Force Trending Hashtag (Arena Feed)</option>
                            <option value="post_likes">Inject Fake Likes to Post (Instant DB Write)</option>
                            <option value="user_followers">Boost Follower Count for Profile</option>
                            <option value="wall_of_fame">Crown User to Wall of Fame</option>
                        </select>
                        
                        <label style="font-size:0.7rem; color:var(--text-muted); font-weight:800; text-transform:uppercase;">Target ID / Keyword</label>
                        <input type="text" id="promoTarget" class="admin-input" placeholder="e.g., Post ID, User ID, or Movie Name" style="margin-bottom:15px;">
                        
                        <label style="font-size:0.7rem; color:var(--text-muted); font-weight:800; text-transform:uppercase;">Artificial Metric Value</label>
                        <input type="text" id="promoMetrics" class="admin-input" placeholder="e.g., '15000' (for likes) or '₹100 Cr Buzz'" style="margin-bottom:20px;">
                        
                        <button class="btn-lock" style="background:linear-gradient(135deg, var(--danger), #b91c1c); color:#FFF;" onclick="engagePromoOverride()"><i class="fa-solid fa-power-off"></i> Engage Global Override</button>

                        <div style="border-top: 1px dashed var(--border-glass); padding-top: 15px; margin-top: 20px;">
                            <h4 style="font-size:0.8rem; color:#FFF; margin-bottom:10px;">Active Marketing Telemetry</h4>
                            <div id="activeOverridesList"><span style="font-size:0.75rem; color:var(--text-muted);">Scanning overrides...</span></div>
                        </div>
                    </div>

                    <!-- RIGHT: QUEUES -->
                    <div class="queues-grid">
                        <div class="queue-container">
                            <div class="queue-header"><span><i class="fa-solid fa-certificate" style="color:var(--verified-blue);"></i> Blue Tick Apps</span></div>
                            <div class="queue-list" id="verificationQueue"><div style="color:var(--text-muted); font-size:0.8rem; text-align:center; padding:2rem;">Scanning...</div></div>
                        </div>
                        <div class="queue-container">
                            <div class="queue-header"><span><i class="fa-solid fa-book-open" style="color:var(--success);"></i> Script Pitches</span></div>
                            <div class="queue-list" id="pitchQueue"><div style="color:var(--text-muted); font-size:0.8rem; text-align:center; padding:2rem;">Scanning...</div></div>
                        </div>
                        <div class="queue-container">
                            <div class="queue-header"><span><i class="fa-solid fa-triangle-exclamation" style="color:var(--danger);"></i> Security Threats</span></div>
                            <div class="queue-list" id="alertsQueue"><div style="color:var(--text-muted); font-size:0.8rem; text-align:center; padding:2rem;">Scanning...</div></div>
                        </div>
                        <div class="queue-container">
                            <div class="queue-header"><span><i class="fa-solid fa-building" style="color:var(--gold-accent);"></i> Studio Accreditations</span></div>
                            <div class="queue-list" id="studioQueue"><div style="color:var(--text-muted); font-size:0.8rem; text-align:center; padding:2rem;">Scanning...</div></div>
                        </div>
                    </div>
                </div>
            `;
            fetchAllQueues();
            fetchActiveOverrides();
        }

        /* -----------------------------------------------------
           REALTIME WEBSOCKET SYNC
        ----------------------------------------------------- */
        function initRealtimeSync() {
            if(liveSyncActive) return;
            const adminChannel = db.channel('executive_vault_sync');
            
            adminChannel.on('postgres_changes', { event: '*', schema: 'public', table: 'admin_telemetry_alerts' }, payload => {
                if(payload.eventType === 'INSERT' && !payload.new.reason.includes('Support')) document.body.classList.add('alert-mode'); setTimeout(() => document.body.classList.remove('alert-mode'), 2000);
                fetchInboxAndThreats();
            });
            adminChannel.on('postgres_changes', { event: '*', schema: 'public', table: 'verification_requests' }, () => fetchVerificationQueue());
            adminChannel.on('postgres_changes', { event: '*', schema: 'public', table: 'producer_pitches' }, () => fetchPitchQueue());
            adminChannel.on('postgres_changes', { event: '*', schema: 'public', table: 'studio_approvals' }, () => fetchStudioQueue());

            adminChannel.subscribe(status => { if(status === 'SUBSCRIBED') liveSyncActive = true; });
        }

        function fetchAllQueues() {
            fetchInboxAndThreats(); fetchVerificationQueue(); fetchPitchQueue(); fetchStudioQueue();
        }

        /* -----------------------------------------------------
           THE STEALTH MARKETING ENGINE (NEW BUSINESS LOGIC)
        ----------------------------------------------------- */
        async function engagePromoOverride() {
            const type = document.getElementById('promoType').value;
            const target = document.getElementById('promoTarget').value.trim();
            const metrics = document.getElementById('promoMetrics').value.trim();

            if(!target) return alert("You must provide a Target ID or Keyword.");

            // SPECIAL CASE: Direct Like Injection into Post
            if (type === 'post_likes') {
                let numericLikes = parseInt(metrics) || 1000;
                try {
                    await db.from('fan_posts').update({ likes_count: numericLikes }).eq('id', target);
                    return alert(`SUCCESS: Injected ${numericLikes} fake likes directly into Post ID: ${target}.`);
                } catch(e) { return alert("Failed to inject likes. Check Post ID."); }
            }

            // Standard Platform Overrides (Hero, Movie, Wall of Fame)
            await db.from('executive_overrides').update({ is_active: false }).eq('campaign_type', type);
            await db.from('executive_overrides').insert({ campaign_type: type, target_keyword: target, fake_metrics: metrics || 'Trending', is_active: true });
            
            alert(`SUCCESS: Marketing Override Activated. [${type}] forced to top.`);
            document.getElementById('promoTarget').value = '';
            document.getElementById('promoMetrics').value = '';
            fetchActiveOverrides();
        }

        async function fetchActiveOverrides() {
            const container = document.getElementById('activeOverridesList');
            const { data } = await db.from('executive_overrides').select('*').eq('is_active', true);
            if (!data || data.length === 0) return container.innerHTML = '<span style="font-size:0.75rem; color:var(--success);">Zero active artificial campaigns.</span>';

            let html = '';
            data.forEach(promo => {
                html += `
                    <div style="background:rgba(239,68,68,0.1); border:1px solid var(--danger); padding:10px; border-radius:8px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong style="color:var(--danger); font-size:0.8rem;">${promo.campaign_type.toUpperCase()}</strong><br>
                            <span style="font-size:0.75rem; color:#FFF;">${promo.target_keyword} (${promo.fake_metrics})</span>
                        </div>
                        <button onclick="killOverride('${promo.id}')" style="background:transparent; border:1px solid var(--danger); color:var(--danger); border-radius:4px; padding:2px 6px; cursor:pointer; font-size:0.6rem;">KILL</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        async function killOverride(id) { await db.from('executive_overrides').update({ is_active: false }).eq('id', id); fetchActiveOverrides(); }

        /* -----------------------------------------------------
           GLOBAL BROADCASTER
        ----------------------------------------------------- */
        async function broadcastAdminPost(userId) {
            const content = document.getElementById('adminPostContent').value.trim();
            const opt1 = document.getElementById('adminPoll1').value.trim();
            const opt2 = document.getElementById('adminPoll2').value.trim();
            if (!content) return alert("Empty broadcast.");

            let isPoll = false; let pollData = null;
            if (opt1 && opt2) { isPoll = true; pollData = { option1: opt1, option2: opt2, votes1: 0, votes2: 0 }; }

            try {
                await db.from('fan_posts').update({ is_featured: false }).eq('is_featured', true);
                await db.from('fan_posts').insert({
                    user_id: userId, author_name: 'TeluguCineCraft Desk', fan_army: 'Official Admin',
                    content: content, streak: 99, is_poll: isPoll, poll_data: pollData, is_featured: true, likes_count:0, comments_count:0, requotes_count:0
                });
                alert("Intel Broadcasted!");
                document.getElementById('adminPostContent').value = '';
            } catch (err) { alert("Broadcast failed."); }
        }

        /* -----------------------------------------------------
           INBOX (SUPPORT) & THREAT QUEUES
        ----------------------------------------------------- */
        async function fetchInboxAndThreats() {
            const { data } = await db.from('admin_telemetry_alerts').select('*').eq('status', 'Pending Admin Warning').order('created_at', { ascending: false });
            
            let threats = [];
            globalSupportTickets = [];

            (data || []).forEach(item => {
                if (item.reason.includes('Support')) globalSupportTickets.push(item);
                else threats.push(item);
            });

            // Update Threat Queue UI
            const tQueue = document.getElementById('alertsQueue');
            if (threats.length === 0) {
                tQueue.innerHTML = `<div style="text-align:center; padding:2rem; color:var(--text-muted);">No active threats.</div>`;
            } else {
                let thtml = '';
                threats.forEach(t => {
                    thtml += `
                        <div class="q-card alert">
                            <div class="q-title"><i class="fa-solid fa-triangle-exclamation"></i> Security Violation</div>
                            <div class="q-meta">User ID: ${t.reporter_id.substring(0,8)}</div>
                            <div class="q-body">${t.reason}</div>
                            <div class="action-group">
                                <button class="action-btn btn-resolve" onclick="resolveAlert('${t.id}')">Dismiss</button>
                                <button class="action-btn btn-reject" onclick="resolveAlert('${t.id}')">Ban</button>
                            </div>
                        </div>
                    `;
                });
                tQueue.innerHTML = thtml;
            }

            // Update Inbox Badge
            const badge = document.getElementById('inboxBadge');
            if (globalSupportTickets.length > 0) {
                badge.innerText = globalSupportTickets.length;
                badge.style.display = 'block';
            } else { badge.style.display = 'none'; }
        }

        async function resolveAlert(id) {
            await db.from('admin_telemetry_alerts').update({ status: 'Resolved' }).eq('id', id);
            fetchInboxAndThreats();
        }

        /* -----------------------------------------------------
           EXECUTIVE INBOX MODAL LOGIC
        ----------------------------------------------------- */
        function openInbox() {
            document.getElementById('inboxModal').style.display = 'flex';
            const listArea = document.getElementById('inboxListArea');
            const readArea = document.getElementById('inboxReadingArea');
            
            readArea.innerHTML = `
                <div style="display:flex; height:100%; align-items:center; justify-content:center; color:var(--text-muted); flex-direction:column; gap:10px;">
                    <i class="fa-solid fa-envelope-open-text fa-3x"></i><p>Select a transmission to read</p>
                </div>
            `;

            if(globalSupportTickets.length === 0) {
                listArea.innerHTML = `<div style="padding:2rem; text-align:center; color:var(--text-muted);">Inbox is empty.</div>`;
                return;
            }

            let html = '';
            globalSupportTickets.forEach(msg => {
                let preview = (msg.post_id || '').substring(0, 30);
                html += `
                    <div class="inbox-item" onclick="readMessage('${msg.id}')">
                        <div class="inbox-item-title">From: User ${msg.reporter_id.substring(0,6)}</div>
                        <div class="inbox-item-preview">${preview}...</div>
                        <div style="font-size:0.65rem; color:var(--cyan-accent); margin-top:5px;">${new Date(msg.created_at).toLocaleDateString()}</div>
                    </div>
                `;
            });
            listArea.innerHTML = html;
        }

        function readMessage(id) {
            const msg = globalSupportTickets.find(m => m.id === id);
            const readArea = document.getElementById('inboxReadingArea');
            readArea.innerHTML = `
                <div style="border-bottom: 1px solid var(--border-glass); padding-bottom: 15px; margin-bottom: 20px;">
                    <h2 style="color:#FFF; font-size:1.3rem; margin-bottom:5px;">User Support Request</h2>
                    <div style="color:var(--text-muted); font-size:0.85rem;"><b>Sender ID:</b> ${msg.reporter_id}</div>
                    <div style="color:var(--text-muted); font-size:0.85rem;"><b>Date:</b> ${new Date(msg.created_at).toLocaleString()}</div>
                </div>
                <div style="font-size:1rem; color:#E2E8F0; line-height:1.6; white-space: pre-wrap; background:rgba(0,0,0,0.3); padding:20px; border-radius:12px; border:1px solid var(--border-glass);">
                    ${msg.post_id || 'No content provided.'}
                </div>
                <div style="margin-top: 20px; display:flex; gap:10px;">
                    <button class="btn-lock" style="width:auto; padding:10px 20px; background:var(--cyan-accent);" onclick="openDirectory('${msg.reporter_id}')"><i class="fa-solid fa-reply"></i> Reply to User</button>
                    <button class="btn-lock" style="width:auto; padding:10px 20px; background:rgba(239,68,68,0.2); color:var(--danger); border:1px solid var(--danger);" onclick="resolveAlert('${msg.id}'); closeModals();"><i class="fa-solid fa-check"></i> Mark Resolved</button>
                </div>
            `;
        }

        /* -----------------------------------------------------
           DIRECTORY & SEND DM LOGIC
        ----------------------------------------------------- */
        function openDirectory(prefillId = '') {
            document.getElementById('directoryModal').style.display = 'flex';
            if (prefillId) {
                document.getElementById('dmTargetId').value = prefillId;
                document.getElementById('dmMessageBody').focus();
            }
        }

        async function searchDirectory() {
            const q = document.getElementById('dirSearchInput').value.trim();
            const area = document.getElementById('dirResultsArea');
            if(!q) return area.innerHTML = '';

            area.innerHTML = '<div style="color:var(--cyan-accent); font-size:0.8rem; text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Searching Fan Database...</div>';
            
            try {
                // We query fan_posts to extract unique user references matching the search
                const { data } = await db.from('fan_posts').select('user_id, author_name, fan_army').ilike('author_name', `%${q}%`).limit(10);
                
                if(!data || data.length === 0) return area.innerHTML = '<div style="color:var(--text-muted); font-size:0.8rem; text-align:center;">No users found.</div>';

                // Filter unique users
                const uniqueUsers = Array.from(new Map(data.map(item => [item['user_id'], item])).values());
                
                let html = '';
                uniqueUsers.forEach(u => {
                    html += `
                        <div class="dir-result-card">
                            <div>
                                <strong style="color:#FFF;">${u.author_name}</strong> <span style="font-size:0.7rem; color:var(--gold-accent);">(${u.fan_army})</span><br>
                                <span style="font-size:0.65rem; color:var(--text-muted); font-family:monospace;">ID: ${u.user_id}</span>
                            </div>
                            <button class="action-btn" style="background:rgba(255,255,255,0.1); color:#FFF; flex:none; width:auto; padding:6px 12px;" onclick="document.getElementById('dmTargetId').value='${u.user_id}'">Select</button>
                        </div>
                    `;
                });
                area.innerHTML = html;
            } catch(e) { area.innerHTML = '<div style="color:var(--danger); font-size:0.8rem; text-align:center;">Search failed.</div>'; }
        }

        async function dispatchAdminDM() {
            const target = document.getElementById('dmTargetId').value.trim();
            const msg = document.getElementById('dmMessageBody').value.trim();
            if(!target || !msg) return alert("Both Target ID and Message Body are required.");

            try {
                // Send system notification to user's arena inbox
                await db.from('notifications').insert({
                    user_id: target, actor_name: 'TeluguCineCraft Admin', type: 'system',
                    message: `Official Dispatch: ${msg}`
                });
                alert("Official Dispatch Transmitted to User Successfully.");
                document.getElementById('dmTargetId').value = '';
                document.getElementById('dmMessageBody').value = '';
            } catch(e) { alert("Transmission failed."); }
        }

        /* -----------------------------------------------------
           REMAINING QUEUES (Verify, Pitches, Studio)
        ----------------------------------------------------- */
        async function fetchVerificationQueue() {
            const { data } = await db.from('verification_requests').select('*').eq('status', 'Pending');
            const c = document.getElementById('verificationQueue');
            document.getElementById('verifyCount').innerText = `${data ? data.length : 0} Pending`;
            if(!data || data.length===0) return c.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-muted);">Clean</div>';
            
            let html = '';
            data.forEach(i => {
                html += `<div class="q-card verify"><div class="q-title">${i.full_name}</div><div class="action-group"><button class="action-btn btn-blue" onclick="db.from('verification_requests').update({status:'Approved'}).eq('id','${i.id}'); fetchVerificationQueue();">Approve</button></div></div>`;
            });
            c.innerHTML = html;
        }

        async function fetchPitchQueue() {
            const { data } = await db.from('producer_pitches').select('*').eq('status', 'Pending Review');
            const c = document.getElementById('pitchQueue');
            document.getElementById('pitchCount').innerText = `${data ? data.length : 0} Pending`;
            if(!data || data.length===0) return c.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-muted);">Clean</div>';
            
            let html = '';
            data.forEach(p => {
                html += `<div class="q-card pitch"><div class="q-title">${p.title || 'Pitch'}</div><div class="action-group"><button class="action-btn btn-approve" onclick="db.from('producer_pitches').update({status:'Approved'}).eq('id','${p.id}'); fetchPitchQueue();">Approve</button></div></div>`;
            });
            c.innerHTML = html;
        }

        async function fetchStudioQueue() {
            const { data } = await db.from('studio_approvals').select('*').eq('status', 'pending');
            const c = document.getElementById('studioQueue');
            document.getElementById('studioCount').innerText = `${data ? data.length : 0} Pending`;
            if(!data || data.length===0) return c.innerHTML = '<div style="text-align:center; padding:2rem; color:var(--text-muted);">Clean</div>';
            
            let html = '';
            data.forEach(s => {
                html += `<div class="q-card studio"><div class="q-title">${s.studio_name}</div><div class="action-group"><button class="action-btn btn-approve" onclick="db.from('studio_approvals').update({status:'approved'}).eq('id','${s.id}'); fetchStudioQueue();">Approve</button></div></div>`;
            });
            c.innerHTML = html;
        }

        function closeModals() {
            document.getElementById('inboxModal').style.display = 'none';
            document.getElementById('directoryModal').style.display = 'none';
        }

        verifyAdminVault();
    </script>
</body>
</html>
