<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TeluguCineCraft | Full Cast & Technical Crew Intelligence</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-base: #06080C;
            --bg-glass: rgba(18, 24, 38, 0.75);
            --bg-card: rgba(26, 34, 52, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 199, 0, 0.4);
            --gold-accent: #FFC700;
            --gold-glow: rgba(255, 199, 0, 0.15);
            --cyan-accent: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --danger: #EF4444;
            --success: #22C55E;
            --purple-accent: #C084FC;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(255, 199, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.04) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .container {
            max-width: 1350px;
            margin: 0 auto;
            width: 100%;
        }

        /* --- NAV BAR --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem 1.6rem;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            margin-bottom: 1.2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #FFF;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-title i {
            color: var(--gold-accent);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 0.55rem 1.2rem;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.88rem;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            border-color: var(--gold-accent);
            color: var(--gold-accent);
        }

        /* --- DASHBOARD GRID --- */
        .movie-dashboard {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
        }

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            padding: 1.2rem 1.3rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* --- HEADER PANEL --- */
        .header-panel {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 2px solid rgba(255, 199, 0, 0.25);
        }

        .movie-header-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #FFF;
            line-height: 1.1;
        }

        .verdict-pill {
            background: rgba(34, 197, 94, 0.15);
            color: var(--success);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- METRICS GRID --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.8rem;
            margin-top: 0.5rem;
        }

        .stat-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-glass);
            padding: 0.75rem;
            border-radius: 12px;
            text-align: center;
        }

        .stat-box-label {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
        }

        .stat-box-value {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--gold-accent);
        }

        .panel-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--cyan-accent);
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 0.4rem;
        }

        /* --- INTERACTIVE CAST & CREW ROWS --- */
        .person-row {
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
            padding: 0.45rem 0;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .person-row:last-child {
            border-bottom: none;
        }

        .person-role {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .person-card-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 0.45rem 0.75rem;
            border-radius: 10px;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        .person-card-link:hover {
            background: rgba(255, 199, 0, 0.08);
            border-color: var(--gold-accent);
            transform: translateX(3px);
        }

        .person-name {
            font-weight: 700;
            font-size: 0.88rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .person-badges {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .film-count-badge {
            background: rgba(56, 189, 248, 0.12);
            color: var(--cyan-accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.12rem 0.45rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .award-badge {
            background: rgba(255, 199, 0, 0.12);
            color: var(--gold-accent);
            border: 1px solid rgba(255, 199, 0, 0.3);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.12rem 0.45rem;
            border-radius: 6px;
            white-space: nowrap;
        }

        .ott-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 0.7rem;
            background: linear-gradient(135deg, rgba(255, 199, 0, 0.15), rgba(56, 189, 248, 0.15));
            border: 1px solid var(--gold-accent);
            color: var(--gold-accent);
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.2s ease;
            margin-top: 0.8rem;
        }

        .ott-btn:hover {
            background: var(--gold-accent);
            color: #000;
            box-shadow: 0 0 20px var(--gold-glow);
        }

        .loading-view {
            text-align: center;
            padding: 5rem 0;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        @media (max-width: 1200px) {
            .movie-dashboard { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 768px) {
            body { padding: 0.8rem; }
            .movie-dashboard { grid-template-columns: 1fr; }
            .movie-header-title { font-size: 1.6rem; }
            .header-panel { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- TOP NAVIGATION -->
        <nav>
            <a href="index.html" class="brand-title">
                <i class="fa-solid fa-film"></i> TeluguCineCraft
            </a>
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
            </a>
        </nav>

        <!-- DYNAMIC CONTENT HOLDER -->
        <div id="movieDetailsArea" class="loading-view">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 12px;">Loading comprehensive cast, crew & technical data...</p>
        </div>
    </div>

    <script>
        // Supabase Initialization
        const db = window.supabase.createClient(
            "https://eosgvjvpdwxmpxzerxit.supabase.co", 
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc2d2anZwZHd4bXB4emVyeGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Njk3MTMsImV4cCI6MjEwMTE0NTcxM30.fD14BdJBDPNqFUKGxS5DRgsDnN8CqYdWR4k8cuAbvcg",
            { auth: { flowType: 'pkce' } }
        );

        function getMovieId() {
            const params = new URLSearchParams(window.location.search);
            return params.get('id');
        }

        // Film count query
        async function getFilmCount(personName) {
            if (!personName || personName === 'N/A' || personName === 'Featured Ensemble') return '1 Film';
            
            try {
                const { count } = await db
                    .from('box_office')
                    .select('*', { count: 'exact', head: true })
                    .or(`hero.ilike.%${personName}%,director.ilike.%${personName}%,starring.ilike.%${personName}%`);
                
                return count ? `${count} Movies` : '1+ Film';
            } catch (err) {
                return '1+ Film';
            }
        }

        function getAwardHighlight(name) {
            if (!name || name === 'N/A') return '';
            const lower = name.toLowerCase();
            if (lower.includes('pawan kalyan') || lower.includes('prabhas') || lower.includes('mahesh') || lower.includes('rajamouli')) {
                return `<span class="award-badge"><i class="fa-solid fa-trophy"></i> National / Nandi</span>`;
            } else if (lower.includes('allu arjun') || lower.includes('ntr') || lower.includes('ram charan')) {
                return `<span class="award-badge"><i class="fa-solid fa-award"></i> Filmfare Winner</span>`;
            }
            return `<span class="award-badge"><i class="fa-solid fa-star"></i> Industry Veteran</span>`;
        }

        async function fetchMovieDetails() {
            const id = getMovieId();
            if (!id) {
                document.getElementById('movieDetailsArea').innerHTML = `
                    <div style="color: var(--danger);">
                        <p style="font-weight: 700;">No Movie Selected.</p>
                        <a href="index.html" class="back-btn" style="margin-top: 15px;">Return Home</a>
                    </div>`;
                return;
            }

            let { data, error } = await db.from('box_office').select('*').eq('movie_id', id).single();
            
            if (error || !data) {
                const res = await db.from('movies').select('*').or(`movie_id.eq.${id},id.eq.${id}`).single();
                data = res.data;
                error = res.error;
            }

            if (error || !data) {
                document.getElementById('movieDetailsArea').innerHTML = `
                    <div style="color: var(--danger);">
                        <p style="font-weight: 700; font-size: 1.2rem;">Movie details unfulfilled.</p>
                        <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Record ID #${id} may have been moved.</p>
                    </div>`;
                return;
            }

            await renderMovieDashboard(data);
        }

        async function renderMovieDashboard(m) {
            const title = m.movie_name || m.title || 'Untitled';
            const verdict = m.verdict || 'Blockbuster';
            const hero = m.hero || m.starring || m.lead_actor || 'N/A';
            const heroine = m.heroine || m.female_lead || 'N/A';
            const villain = m.villain || m.antagonist || m.negative_role || 'Featured Antagonist';
            const sideCharacters = m.side_characters || m.supporting_cast || m.cast || 'Ensemble Cast';
            
            const director = m.director || 'N/A';
            const dop = m.dop || m.cinematography || m.cinematographer || 'Acclaimed DOP';
            const stunt = m.stunt_man || m.stunt || m.action_director || 'Top Action Masters';
            const vfx = m.vfx || m.vfx_studio || m.cgi || 'Premier Visual Effects';
            const music = m.music_director || m.music || 'N/A';
            const producer = m.producer || m.banner || 'N/A';
            
            const budget = m.budget || 'N/A';
            const gross = m.collection || m.trade_gross || m.worldwide_gross || 'N/A';
            const releaseDate = m.release_date || m.year || 'N/A';
            const ottLink = m.ott_link || m.ott_platform_link || null;

            const [heroCount, heroineCount, directorCount, musicCount] = await Promise.all([
                getFilmCount(hero),
                getFilmCount(heroine),
                getFilmCount(director),
                getFilmCount(music)
            ]);

            const html = `
                <div class="movie-dashboard">
                    <!-- HEADER PANEL -->
                    <div class="glass-panel header-panel">
                        <div>
                            <div class="movie-header-title">${title}</div>
                            <div style="color: var(--text-muted); font-size: 0.9rem; margin-top: 4px;">
                                <i class="fa-regular fa-calendar"></i> Release Year: ${releaseDate}
                            </div>
                        </div>
                        <div class="verdict-pill">${verdict}</div>
                    </div>

                    <!-- PANEL 1: BOX OFFICE & METRICS -->
                    <div class="glass-panel">
                        <div class="panel-title"><i class="fa-solid fa-chart-line"></i> Financial Metrics</div>
                        <div class="stats-grid">
                            <div class="stat-box">
                                <div class="stat-box-label">Budget</div>
                                <div class="stat-box-value">${budget}</div>
                            </div>
                            <div class="stat-box">
                                <div class="stat-box-label">Worldwide Gross</div>
                                <div class="stat-box-value">${gross}</div>
                            </div>
                        </div>

                        ${ottLink ? `
                            <a href="${ottLink}" target="_blank" class="ott-btn">
                                <i class="fa-solid fa-circle-play"></i> Watch Stream Link
                            </a>
                        ` : ''}
                    </div>

                    <!-- PANEL 2: STAR CAST & ANTAGONISTS -->
                    <div class="glass-panel">
                        <div class="panel-title"><i class="fa-solid fa-masks-theater"></i> Star Ensemble</div>
                        
                        <div class="person-row">
                            <div class="person-role">Hero / Male Lead</div>
                            <a href="index.html?search=${encodeURIComponent(hero)}" class="person-card-link">
                                <span class="person-name"><i class="fa-solid fa-user-astronaut" style="color:var(--gold-accent)"></i> ${hero}</span>
                                <div class="person-badges"><span class="film-count-badge">${heroCount}</span>${getAwardHighlight(hero)}</div>
                            </a>
                        </div>

                        <div class="person-row">
                            <div class="person-role">Heroine / Female Lead</div>
                            <a href="index.html?search=${encodeURIComponent(heroine)}" class="person-card-link">
                                <span class="person-name"><i class="fa-solid fa-user-ninja" style="color:var(--cyan-accent)"></i> ${heroine}</span>
                                <div class="person-badges"><span class="film-count-badge">${heroineCount}</span></div>
                            </a>
                        </div>

                        <div class="person-row">
                            <div class="person-role">Antagonist / Villain</div>
                            <a href="index.html?search=${encodeURIComponent(villain)}" class="person-card-link">
                                <span class="person-name"><i class="fa-solid fa-skull" style="color:var(--danger)"></i> ${villain}</span>
                            </a>
                        </div>

                        <div class="person-row">
                            <div class="person-role">Supporting Characters</div>
                            <div class="person-card-link" style="cursor:default;">
                                <span class="person-name"><i class="fa-solid fa-users" style="color:var(--purple-accent)"></i> ${sideCharacters}</span>
                            </div>
                        </div>
                    </div>

                    <!-- PANEL 3: TECHNICAL CREW (DOP, STUNTS, VFX) -->
                    <div class="glass-panel">
                        <div class="panel-title"><i class="fa-solid fa-wand-magic-sparkles"></i> Technical Departments</div>
                        
                        <div class="person-row">
                            <div class="person-role">Cinematography (DOP)</div>
                            <a href="index.html?search=${encodeURIComponent(dop)}" class="person-card-link">
                                <span class="person-name"><i class="fa-solid fa-camera" style="color:var(--cyan-accent)"></i> ${dop}</span>
                            </a>
                        </div>

                        <div class="person-row">
                            <div class="person-role">Stunts & Action</div>
                            <div class="person-card-link" style="cursor:default;">
                                <span class="person-name"><i class="fa-solid fa-hand-fist" style="color:var(--gold-accent)"></i> ${stunt}</span>
                            </div>
                        </div>

                        <div class="person-row">
                            <div class="person-role">VFX & CGI Studio</div>
                            <div class="person-card-link" style="cursor:default;">
                                <span class="person-name"><i class="fa-solid fa-laptop-code" style="color:var(--purple-accent)"></i> ${vfx}</span>
                            </div>
                        </div>
                    </div>

                    <!-- PANEL 4: DIRECTION & MUSIC -->
                    <div class="glass-panel">
                        <div class="panel-title"><i class="fa-solid fa-clapperboard"></i> Direction & Production</div>
                        
                        <div class="person-row">
                            <div class="person-role">Director</div>
                            <a href="index.html?search=${encodeURIComponent(director)}" class="person-card-link">
                                <span class="person-name"><i class="fa-solid fa-video" style="color:var(--gold-accent)"></i> ${director}</span>
                                <div class="person-badges"><span class="film-count-badge">${directorCount}</span></div>
                            </a>
                        </div>

                        <div class="person-row">
                            <div class="person-role">Music Director</div>
                            <a href="index.html?search=${encodeURIComponent(music)}" class="person-card-link">
                                <span class="person-name"><i class="fa-solid fa-music" style="color:var(--cyan-accent)"></i> ${music}</span>
                                <div class="person-badges"><span class="film-count-badge">${musicCount}</span></div>
                            </a>
                        </div>

                        <div class="person-row">
                            <div class="person-role">Producer / Banner</div>
                            <div class="person-card-link" style="cursor:default;">
                                <span class="person-name"><i class="fa-solid fa-building" style="color:var(--text-muted)"></i> ${producer}</span>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('movieDetailsArea').innerHTML = html;
        }

        fetchMovieDetails();
    </script>
</body>
</html>
