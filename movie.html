<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft | Individual Profile</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

    <style>
        :root {
            --bg-base: #06080C;
            --bg-glass: rgba(18, 24, 38, 0.75);
            --bg-card: rgba(26, 34, 52, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 199, 0, 0.4);
            --gold-accent: #FFC700;
            --gold-glow: rgba(255, 199, 0, 0.15);
            --cyan-accent: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --danger: #EF4444;
            --success: #22C55E;
            --purple-accent: #C084FC;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(255, 199, 0, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.04) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 1.2rem;
            display: flex; flex-direction: column; justify-content: center;
        }

        .container { max-width: 1350px; margin: 0 auto; width: 100%; }

        /* Navigation */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 0.85rem 1.6rem; background: var(--bg-glass);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 16px; margin-bottom: 1.2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        .brand-title { font-size: 1.4rem; font-weight: 800; color: #FFF; display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .brand-title i { color: var(--gold-accent); }
        .nav-actions { display: flex; align-items: center; gap: 12px; }
        .back-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); color: var(--text-main); padding: 0.55rem 1.2rem; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 0.88rem; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease; }
        .back-btn:hover { border-color: var(--gold-accent); color: var(--gold-accent); }

        /* Genre Badge Styling */
        .genre-badge {
            background: rgba(56, 189, 248, 0.1);
            color: var(--cyan-accent);
            border: 1px solid rgba(56, 189, 248, 0.2);
            padding: 0.3rem 0.8rem;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-block;
            margin-right: 6px;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Movie Dashboard Components */
        .movie-dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; }
        .glass-panel { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-glass); border-radius: 18px; padding: 1.2rem 1.3rem; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; justify-content: space-between; }
        .header-panel { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255, 199, 0, 0.25); }
        .movie-header-title { font-size: 2.2rem; font-weight: 800; color: #FFF; line-height: 1.1; }
        .verdict-pill { padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .verdict-pill.blockbuster { background: rgba(34, 197, 94, 0.2); color: #22C55E; border: 1px solid rgba(34, 197, 94, 0.4); }
        .verdict-pill.superhit { background: rgba(255, 199, 0, 0.18); color: #FFC700; border: 1px solid rgba(255, 199, 0, 0.4); }
        .verdict-pill.hit { background: rgba(56, 189, 248, 0.18); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .verdict-pill.average { background: rgba(245, 158, 11, 0.18); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.4); }
        .verdict-pill.flop { background: rgba(239, 68, 68, 0.18); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.4); }
        .verdict-pill.disaster { background: rgba(185, 28, 28, 0.25); color: #F87171; border: 1px solid rgba(185, 28, 28, 0.5); }
        
        .panel-title { font-size: 1rem; font-weight: 700; color: var(--cyan-accent); margin-bottom: 0.8rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.4rem; }
        .person-row { display: flex; flex-direction: column; gap: 0.2rem; padding: 0.45rem 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.05); }
        .person-role { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 600; letter-spacing: 0.5px; }
        .person-card-link { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-glass); padding: 0.45rem 0.75rem; border-radius: 10px; text-decoration: none; color: var(--text-main); transition: all 0.2s ease; }
        .person-card-link:hover { background: rgba(255, 199, 0, 0.08); border-color: var(--gold-accent); transform: translateX(3px); }
        .person-name { font-weight: 700; font-size: 0.88rem; display: flex; align-items: center; gap: 6px; }
        .film-count-badge { background: rgba(56, 189, 248, 0.12); color: var(--cyan-accent); border: 1px solid rgba(56, 189, 248, 0.3); font-size: 0.68rem; font-weight: 700; padding: 0.12rem 0.45rem; border-radius: 6px; }
        .loading-view { text-align: center; padding: 5rem 0; color: var(--text-muted); font-size: 1.2rem; }

        @media (max-width: 1200px) { .movie-dashboard { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 768px) { .movie-dashboard { grid-template-columns: 1fr; } .movie-header-title { font-size: 1.6rem; } }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html" class="brand-title"><i class="fa-solid fa-film"></i> TeluguCineCraft</a>
            <div class="nav-actions"><a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a></div>
        </nav>

        <div id="movieDetailsArea" class="loading-view">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            <p style="margin-top: 12px;">Loading metadata & viewer intelligence...</p>
        </div>
    </div>

    <script>
        const db = window.supabase.createClient(
            "https://eosgvjvpdwxmpxzerxit.supabase.co", 
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc2d2anZwZHd4bXB4emVyeGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Njk3MTMsImV4cCI6MjEwMTE0NTcxM30.fD14BdJBDPNqFUKGxS5DRgsDnN8CqYdWR4k8cuAbvcg"
        );

        function getMovieId() { return new URLSearchParams(window.location.search).get('id'); }
        
        async function renderMovieDashboard(m) {
            const title = m.movie_name || m.title || 'Untitled';
            const releaseDate = m.release_date || m.year || 'N/A';
            
            // Genre Renderer
            const genres = m.genre ? m.genre.split(',').map(g => g.trim()) : ['General'];
            const genreHtml = genres.map(g => `<span class="genre-badge">${g}</span>`).join('');

            const verdictObj = getVerdict(m);
            
            const html = `
                <div class="movie-dashboard">
                    <div class="glass-panel header-panel">
                        <div>
                            <div class="movie-header-title">${title}</div>
                            <div style="color: var(--text-muted); font-size: 0.9rem; margin-top: 6px;">
                                <i class="fa-regular fa-calendar"></i> ${releaseDate}
                            </div>
                            <div>${genreHtml}</div>
                        </div>
                        <div class="verdict-pill ${verdictObj.label.toLowerCase().replace(/\s+/g, '')}">${verdictObj.label}</div>
                    </div>
                </div>
            `;
            document.getElementById('movieDetailsArea').innerHTML = html;
        }

        async function fetchMovieDetails() {
            const id = getMovieId();
            if (!id) return;
            let { data, error } = await db.from('box_office').select('*').eq('movie_id', id).single();
            if (error || !data) {
                const res = await db.from('movies').select('*').or(`movie_id.eq.${id},id.eq.${id}`).single();
                data = res.data;
            }
            if (data) renderMovieDashboard(data);
        }

        fetchMovieDetails();
    </script>
</body>
</html>
