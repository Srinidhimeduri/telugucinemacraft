<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0B0E14; --card: #151921; --gold: #FFD700; --text: #E2E8F0; --muted: #94A3B8; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 2rem; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .row { display: flex; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #1F2937; }
        .label { color: var(--muted); font-weight: 500; }
        h1 { color: var(--gold); margin-top: 0; font-size: 2rem; }
    </style>
</head>
<body>
    <div class="container" id="content">Loading Movie...</div>

    <script>
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient(
                "https://eosgvjvpdwxmpxzerxit.supabase.co", 
                "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx"
            );
        }
        const db = window.myFixedClient;

        async function init() {
            const movieId = new URLSearchParams(window.location.search).get('id');
            if (!movieId) {
                document.getElementById('content').innerHTML = "<h1>No Movie Selected</h1>";
                return;
            }

            const { data, error } = await db.from('box_office').select('*').eq('movie_id', movieId).maybeSingle();
            
            if (error || !data) {
                document.getElementById('content').innerHTML = "<h1>Movie Not Found</h1>";
                return;
            }

            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h1>${data.movie_name}</h1>
                    <div class="row"><span class="label">Director</span><span>${data.director || 'N/A'}</span></div>
                    <div class="row"><span class="label">Producer</span><span>${data.producer || 'N/A'}</span></div>
                    <div class="row"><span class="label">Starring</span><span>${data.starring || 'N/A'}</span></div>
                    <div class="row"><span class="label">Music</span><span>${data.music_director || 'N/A'}</span></div>
                    <div class="row"><span class="label">Verdict</span><span style="color:var(--gold)">${data.verdict || 'N/A'}</span></div>
                </div>
            `;
        }
        init();
    </script>
</body>
</html>
