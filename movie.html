<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details | TeluguCineCraft</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-base: #05070A; --bg-glass: rgba(15, 20, 28, 0.65); --border-glass: rgba(255, 255, 255, 0.06); --gold-accent: #FFC700; --cyan-accent: #38BDF8; --text-main: #F8FAFC; --text-muted: #94A3B8; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2.5rem 1.5rem; }
        .container { max-width: 1150px; margin: 0 auto; }
        .dashboard-grid { display: grid; grid-template-columns: 1.6fr 1.2fr; gap: 1.5rem; }
        .card { background: var(--bg-glass); backdrop-filter: blur(20px); border: 1px solid var(--border-glass); border-radius: 20px; padding: 2rem; margin-bottom: 1.5rem; }
        h1 { font-size: 2.4rem; font-weight: 800; margin-bottom: 0.5rem; }
        .section-title { font-size: 0.85rem; text-transform: uppercase; color: var(--cyan-accent); margin-bottom: 1.2rem; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.6rem; }
        .crew-tag { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); padding: 0.5rem 1rem; border-radius: 12px; display: inline-block; margin: 5px; text-decoration: none; color: var(--text-main); font-size: 0.9rem; }
        .finance-box { background: rgba(0,0,0,0.3); padding: 1.2rem; border-radius: 14px; text-align: center; margin-bottom: 1rem; }
        .val { font-size: 1.7rem; font-weight: 800; color: var(--gold-accent); }
        .rating-row { display: flex; justify-content: space-between; padding: 0.7rem; background: rgba(0,0,0,0.2); border-radius: 8px; margin-bottom: 0.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" style="color:var(--cyan-accent); text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <div id="content" style="margin-top:2rem;">Loading...</div>
    </div>

    <script>
        const db = window.supabase.createClient(
            "https://eosgvjvpdwxmpxzerxit.supabase.co", 
            "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx",
            { auth: { flowType: 'pkce' } }
        );

        async function init() {
            const id = new URLSearchParams(window.location.search).get('id');
            const { data } = await db.from('box_office').select('*');
            const m = data.find(x => x.movie_id == id);
            
            document.getElementById('content').innerHTML = `
                <div class="card movie-header-banner">
                    <h1>${m.movie_name}</h1>
                    <span class="verdict-badge" style="color:var(--cyan-accent)">Verdict: ${m.verdict}</span>
                </div>
                <div class="dashboard-grid">
                    <div class="card">
                        <div class="section-title">Cast & Crew Network</div>
                        ${m.starring.split(',').map(n => `<a class="crew-tag">${n}</a>`).join('')}
                        <div class="section-title" style="margin-top:20px;">Director</div>
                        <a class="crew-tag">${m.director}</a>
                    </div>
                    <div>
                        <div class="card">
                            <div class="finance-box"><div class="label">Budget</div><div class="val">${m.budget}</div></div>
                            <div class="finance-box"><div class="label">Worldwide Gross</div><div class="val">${m.trade_gross}</div></div>
                        </div>
                        <div class="card">
                            <div class="section-title">Categorized Ratings</div>
                            <div class="rating-row">Direction <span>★★★★★</span></div>
                            <div class="rating-row">Music <span>★★★★★</span></div>
                        </div>
                    </div>
                </div>
            `;
        }
        init();
    </script>
</body>
</html>
