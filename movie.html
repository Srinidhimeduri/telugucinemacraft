<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #070B14; --gold: #FBBF24; --text: #F8FAFC; --border: #1F2937; --blue: #38BDF8; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 2rem; }
        .container { max-width: 900px; margin: 0 auto; }
        .data-row { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
        .card { background: #111827; padding: 20px; border-radius: 12px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container" id="content">Loading...</div>
    <script>
        // Force-refreshing the client variable to bypass cache
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient("https://eosgvjvpdwxmpxzerxit.supabase.co", "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx");
        }
        const db = window.myFixedClient;
        const movieId = new URLSearchParams(window.location.search).get('id');

        async function init() {
            const { data, error } = await db.from('box_office').select('*').eq('movie_id', movieId).maybeSingle();
            
            if (error || !data) {
                document.getElementById('content').innerHTML = "<h1>Movie Not Found</h1>";
                return;
            }

            document.getElementById('content').innerHTML = `
                <h1>${data.movie_name}</h1>
                <div class="card">
                    <div class="data-row"><span>Director</span><span>${data.director || 'N/A'}</span></div>
                    <div class="data-row"><span>Producer</span><span>${data.producer || 'N/A'}</span></div>
                    <div class="data-row"><span>Starring</span><span>${data.starring || 'N/A'}</span></div>
                    <div class="data-row"><span>Budget</span><span>${data.budget || 'N/A'}</span></div>
                    <div class="data-row"><span>Verdict</span><span>${data.verdict || 'N/A'}</span></div>
                </div>
            `;
        }
        init();
    </script>
</body>
</html>
