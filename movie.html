<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TeluguCineCraft Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0B0E14; color: #fff; font-family: sans-serif; padding: 2rem; }
        .row { padding: 10px 0; border-bottom: 1px solid #333; }
    </style>
</head>
<body>
    <div id="content">Loading...</div>
    <script>
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient("https://eosgvjvpdwxmpxzerxit.supabase.co", "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx");
        }
        const db = window.myFixedClient;

        async function init() {
            const movieId = new URLSearchParams(window.location.search).get('id');
            const { data } = await db.from('box_office').select('*').eq('movie_id', movieId).maybeSingle();
            
            // DEBUG: This will show in your Console (F12)
            console.log("Movie Data Loaded:", data);

            if (!data) {
                document.getElementById('content').innerHTML = "<h1>Error: Movie not found in database</h1>";
                return;
            }

            // Helper to generate links safely
            const buildLink = (name, role) => {
                if(!name) return "N/A";
                // URL encode the name to ensure it doesn't break the link
                return `<a href="technician.html?name=${encodeURIComponent(name.trim())}&role=${role}">${name}</a>`;
            };

            document.getElementById('content').innerHTML = `
                <h1>${data.movie_name}</h1>
                <div class="row">Director: ${buildLink(data.director, 'director')}</div>
                <div class="row">Starring: ${buildLink(data.starring, 'hero')}</div>
                <div class="row">Music: ${buildLink(data.music_director, 'music')}</div>
            `;
        }
        init();
    </script>
</body>
</html>
