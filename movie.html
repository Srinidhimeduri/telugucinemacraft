<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TeluguCineCraft</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0B0E14; --gold: #FFD700; --text: #E2E8F0; --blue: #38BDF8; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 2rem; }
        .card { background: #151921; padding: 20px; border-radius: 12px; max-width: 800px; margin: auto; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #1F2937; }
        .link { color: var(--blue); text-decoration: none; cursor: pointer; }
        .count { color: var(--gold); font-size: 0.8rem; margin-left: 5px; }
    </style>
</head>
<body>
    <div id="content" class="card">Loading...</div>
    <script>
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient("https://eosgvjvpdwxmpxzerxit.supabase.co", "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx");
        }
        const db = window.myFixedClient;

        async function init() {
            const movieId = new URLSearchParams(window.location.search).get('id');
            const { data: movie } = await db.from('box_office').select('*').eq('movie_id', movieId).maybeSingle();
            const { data: all } = await db.from('box_office').select('*');

            const getCount = (name) => all.filter(m => 
                [m.director, m.producer, m.starring, m.supporting_cast].join(',').toLowerCase().includes(name.toLowerCase())
            ).length;

            const renderLink = (names) => names ? names.split(',').map(n => {
                const clean = n.trim();
                return `<a class="link" href="technician.html?name=${encodeURIComponent(clean)}">${clean}<span class="count">(${getCount(clean)})</span></a>`;
            }).join(', ') : 'N/A';

            document.getElementById('content').innerHTML = `
                <h1>${movie.movie_name}</h1>
                <div class="row"><span>Director</span><span>${renderLink(movie.director)}</span></div>
                <div class="row"><span>Starring</span><span>${renderLink(movie.starring)}</span></div>
                <div class="row"><span>Producer</span><span>${renderLink(movie.producer)}</span></div>
            `;
        }
        init();
    </script>
</body>
</html>
