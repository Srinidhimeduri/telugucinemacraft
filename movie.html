<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft | Movie Detail & Craft Index</title>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-color: #0B0F19;
            --card-bg: #1E293B;
            --accent-gold: #FBBF24;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --border-color: #334155;
            --star-inactive: #475569;
            --hit-green: #22C55E;
            --badge-blue: #38BDF8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            background-color: #0F172A;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .nav-logo {
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 2rem 0;
        }

        .back-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .movie-header {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--accent-gold);
            margin: 0 0 0.5rem 0;
            font-size: 2.2rem;
        }

        .meta-row {
            color: var(--text-sub);
            font-size: 1rem;
            margin-bottom: 0.8rem;
        }

        .trade-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--badge-blue);
            border: 1px solid var(--badge-blue);
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-left: 6px;
        }

        /* Craft Scorecard Matrix (Above the Fold) */
        .scorecard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            background-color: #0F172A;
            padding: 1.2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-top: 1.5rem;
        }

        .score-box {
            text-align: center;
        }

        .score-box .label {
            font-size: 0.75rem;
            color: var(--text-sub);
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .score-box .val {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--accent-gold);
        }

        .craft-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .craft-title {
            font-size: 1.3rem;
            color: var(--accent-gold);
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .craft-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .craft-name {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .star-rating {
            display: flex;
            gap: 6px;
        }

        .star {
            font-size: 1.8rem;
            color: var(--star-inactive);
            cursor: pointer;
            transition: color 0.15s ease;
            user-select: none;
        }

        .star.active {
            color: var(--accent-gold);
        }

        textarea {
            width: 100%;
            background-color: #0F172A;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
            min-height: 80px;
            margin-top: 1.5rem;
            outline: none;
            font-family: inherit;
        }

        .btn-submit {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin-top: 1.2rem;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">TeluguCineCraft</a>
    </nav>

    <div class="container">
        <a href="index.html" class="back-link">← Back to Index</a>

        <!-- Screen 1: Header + Verified Trade Data + Live Aggregate Scorecard -->
        <div class="movie-header" id="movieHeader">
            <h1>Loading Movie Details...</h1>
        </div>

        <!-- Screen 2: Interactive Rating Form -->
        <div class="craft-card">
            <div class="craft-title">Rate the Crafts</div>

            <form id="craftRatingForm">
                <div class="craft-row">
                    <span class="craft-name">Direction & Screenplay</span>
                    <div class="star-rating" data-craft="direction">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>
                </div>

                <div class="craft-row">
                    <span class="craft-name">Cinematography & Lighting</span>
                    <div class="star-rating" data-craft="cinematography">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>
                </div>

                <div class="craft-row">
                    <span class="craft-name">Music & Background Score (BGM)</span>
                    <div class="star-rating" data-craft="music">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>
                </div>

                <div class="craft-row">
                    <span class="craft-name">Action & Stunts</span>
                    <div class="star-rating" data-craft="stunts">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>
                </div>

                <div class="craft-row">
                    <span class="craft-name">Visual Effects (VFX / CGI)</span>
                    <div class="star-rating" data-craft="vfx">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>
                </div>

                <textarea id="reviewComment" placeholder="Write a technical note on the crafts (Optional)..."></textarea>

                <button type="button" class="btn-submit" onclick="submitRating()">Submit Verified Craft Rating</button>
            </form>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://eosgvjvpdwxmpxzerxit.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx";
        let supabaseClient;

        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id') || 'peddi';

        const selectedRatings = { direction: 4, cinematography: 4, music: 4, stunts: 4, vfx: 4 };

        document.addEventListener("DOMContentLoaded", function() {
            if (typeof supabase !== 'undefined') {
                const { createClient } = supabase;
                supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                loadPageData();
            }

            document.querySelectorAll('.star-rating').forEach(group => {
                const craft = group.dataset.craft;
                const stars = group.querySelectorAll('.star');
                updateStarVisuals(stars, selectedRatings[craft]);

                stars.forEach(star => {
                    star.addEventListener('click', () => {
                        const val = parseInt(star.dataset.value);
                        selectedRatings[craft] = val;
                        updateStarVisuals(stars, val);
                    });
                });
            });
        });

        function updateStarVisuals(stars, value) {
            stars.forEach(s => {
                if (parseInt(s.dataset.value) <= value) {
                    s.classList.add('active');
                } else {
                    s.classList.remove('active');
                }
            });
        }

        async function loadPageData() {
            // Fetch Movie Info
            const { data: movie } = await supabaseClient.from('movies').select('*').eq('id', movieId).single();
            
            // Fetch All Craft Ratings to Calculate Aggregate Averages
            const { data: ratings } = await supabaseClient.from('ratings').select('*').eq('movie_id', movieId);

            const header = document.getElementById('movieHeader');
            if (!movie) {
                header.innerHTML = `<h1>Movie Not Found</h1>`;
                return;
            }

            // Calculate Averages
            let avgDir = 0, avgCam = 0, avgMusic = 0, avgStunts = 0, avgVfx = 0, avgOverall = 0;
            const count = ratings ? ratings.length : 0;

            if (count > 0) {
                avgDir = (ratings.reduce((acc, r) => acc + (parseFloat(r.direction_score) || 0), 0) / count).toFixed(1);
                avgCam = (ratings.reduce((acc, r) => acc + (parseFloat(r.cinematography_score) || 0), 0) / count).toFixed(1);
                avgMusic = (ratings.reduce((acc, r) => acc + (parseFloat(r.music_score) || 0), 0) / count).toFixed(1);
                avgStunts = (ratings.reduce((acc, r) => acc + (parseFloat(r.stunts_score) || 0), 0) / count).toFixed(1);
                avgVfx = (ratings.reduce((acc, r) => acc + (parseFloat(r.vfx_score) || 0), 0) / count).toFixed(1);
                avgOverall = (ratings.reduce((acc, r) => acc + (parseFloat(r.overall_score) || 0), 0) / count).toFixed(1);
            }

            header.innerHTML = `
                <h1>${movie.title}</h1>
                <div class="meta-row">Starring: <strong>${movie.starring || 'N/A'}</strong> | Director: <strong>${movie.director || 'N/A'}</strong></div>
                <div class="meta-row">
                    Trade Gross: <strong style="color:var(--accent-gold);">${movie.ww_gross || 'TBD'}</strong> 
                    <span class="trade-badge">✓ ${movie.source_badge || 'Trade Consensus'}</span>
                </div>

                <div class="scorecard-grid">
                    <div class="score-box"><div class="label">Overall Score</div><div class="val">${count > 0 ? avgOverall + ' ★' : 'N/A'}</div></div>
                    <div class="score-box"><div class="label">Direction</div><div class="val">${count > 0 ? avgDir : '-'}</div></div>
                    <div class="score-box"><div class="label">Lighting / DOP</div><div class="val">${count > 0 ? avgCam : '-'}</div></div>
                    <div class="score-box"><div class="label">Music / BGM</div><div class="val">${count > 0 ? avgMusic : '-'}</div></div>
                    <div class="score-box"><div class="label">Stunts</div><div class="val">${count > 0 ? avgStunts : '-'}</div></div>
                    <div class="score-box"><div class="label">VFX</div><div class="val">${count > 0 ? avgVfx : '-'}</div></div>
                </div>
            `;
        }

        async function submitRating() {
            if (!supabaseClient) return;

            const comment = document.getElementById('reviewComment').value;
            const overall = ((selectedRatings.direction + selectedRatings.cinematography + selectedRatings.music + selectedRatings.stunts + selectedRatings.vfx) / 5).toFixed(1);
            const demoUserId = "00000000-0000-0000-0000-000000000000";

            const { error } = await supabaseClient.from('ratings').insert([
                {
                    movie_id: movieId,
                    user_id: demoUserId,
                    overall_score: parseFloat(overall),
                    direction_score: selectedRatings.direction,
                    cinematography_score: selectedRatings.cinematography,
                    music_score: selectedRatings.music,
                    stunts_score: selectedRatings.stunts,
                    vfx_score: selectedRatings.vfx,
                    review_comment: comment
                }
            ]);

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("Craft rating submitted! Aggregate scores updated.");
                loadPageData(); // Refresh aggregate scorecard live
            }
        }
    </script>
</body>
</html>
