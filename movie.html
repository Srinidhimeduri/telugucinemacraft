<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0B0E14; --card: #151921; --gold: #FFD700; --text: #E2E8F0; --muted: #94A3B8; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 2rem; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; }
        .movie-header { border-bottom: 2px solid var(--card); padding-bottom: 1rem; margin-bottom: 2rem; }
        .movie-title { color: var(--gold); font-size: 2.5rem; margin: 0; }
        .info-card { background: var(--card); padding: 1.5rem; border-radius: 12px; display: grid; gap: 1rem; }
        .row { display: flex; justify-content: space-between; border-bottom: 1px solid #1F2937; padding: 0.5rem 0; }
        .label { color: var(--muted); font-weight: 500; }
    </style>
</head>
<body>
    <div class="container" id="content">Loading Details...</div>
    <script>
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient("https://eosgvjvpdwxmpxzerxit.supabase.co", "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx");
        }
        const db = window.myFixedClient;
        const movieId = new URLSearchParams(window.location.search).get('id');

        async function init() {
            const { data } = await db.from('box_office').select('*').eq('movie_id', movieId).maybeSingle();
            if (!data) return document.getElementById('content').innerHTML = "<h1>Movie Not Found</h1>";
            
            document.getElementById('content').innerHTML = `
                <div class="movie-header"><h1 class="movie-title">${data.movie_name}</h1></div>
                <div class="info-card">
                    <div class="row"><span class="label">Director</span><span>${data.director || 'N/A'}</span></div>
                    <div class="row"><span class="label">Producer</span><span>${data.producer || 'N/A'}</span></div>
                    <div class="row"><span class="label">Starring</span><span>${data.starring || 'N/A'}</span></div>
                    <div class="row"><span class="label">Budget</span><span>${data.budget || 'N/A'}</span></div>
                    <div class="row"><span class="label">Verdict</span><span style="color:var(--gold)">${data.verdict || 'N/A'}</span></div>
                </div>
            `;
        }
        init();
    </script>
</body>
</html>
