<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details | TeluguCineCraft</title>
    
    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-base: #05070A;
            --bg-glass: rgba(15, 20, 28, 0.65);
            --bg-glass-hover: rgba(25, 32, 45, 0.8);
            --border-glass: rgba(255, 255, 255, 0.06);
            --gold-accent: #FFC700;
            --gold-glow: rgba(255, 199, 0, 0.25);
            --cyan-accent: #38BDF8;
            --cyan-glow: rgba(56, 189, 248, 0.2);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --success: #10B981;
            --danger: #EF4444;
            --card-radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 2.5rem 1.5rem;
            background-image: 
                radial-gradient(circle at 15% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 85% 100%, rgba(255, 199, 0, 0.05) 0%, transparent 50%);
            background-attachment: fixed;
        }

        .container { max-width: 1150px; margin: 0 auto; }

        /* Navigation */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            padding: 0.7rem 1.2rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-glass);
            border-radius: 10px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .back-btn:hover { 
            background: rgba(56, 189, 248, 0.1); 
            color: var(--cyan-accent);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        /* 2-Column Responsive Layout Grid */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1.6fr 1.2fr;
            gap: 1.5rem;
            align-items: start;
        }

        @media (max-width: 900px) {
            .dashboard-grid { grid-template-columns: 1fr; }
        }

        /* Card Styling */
        .card {
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: var(--card-radius);
            padding: 2rem;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            position: relative;
            overflow: hidden;
        }

        .movie-header-banner { margin-bottom: 1.5rem; }

        h1 {
            color: #FFF;
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 0.2rem;
        }

        .section-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--cyan-accent);
            margin: 0 0 1.2rem 0;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 0.6rem;
        }

        /* Modern Crew Tags */
        .crew-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 1.2rem;
        }

        .crew-tag {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            min-width: 130px;
        }

        .crew-tag:hover {
            background: var(--bg-glass-hover);
            border-color: rgba(255, 199, 0, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.3), 0 0 12px var(--gold-glow);
        }

        .crew-role {
            font-size: 0.68rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .crew-name {
            font-size: 0.98rem;
            color: var(--text-main);
            font-weight: 700;
        }

        .badge-container { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }

        .movie-count-badge, .award-badge {
            font-size: 0.62rem;
            padding: 2px 7px;
            border-radius: 20px;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .movie-count-badge {
            background: rgba(56, 189, 248, 0.15);
            color: var(--cyan-accent);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        
        .award-badge {
            background: rgba(255, 199, 0, 0.15);
            color: var(--gold-accent);
            border: 1px solid rgba(255, 199, 0, 0.2);
        }

        /* Financial Box Widget */
        .finance-vertical { display: flex; flex-direction: column; gap: 1rem; }

        .finance-box {
            background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.4) 100%);
            padding: 1.2rem;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.04);
            text-align: center;
        }

        .finance-box .label {
            display: block;
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .finance-box .val {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--gold-accent);
        }

        .verdict-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 0.5rem 1.2rem;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .verdict-badge.hit {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .verdict-badge.flop {
            background: rgba(239, 68, 68, 0.15);
            color: var(--danger);
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        /* Categorized Rating Module */
        .category-rating-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.2rem 0;
        }

        .rating-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.25);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .rating-label {
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .star-picker {
            display: inline-flex;
            flex-direction: row-reverse;
            gap: 6px;
        }

        .star-picker input { display: none; }
        .star-picker label {
            font-size: 1.25rem;
            color: rgba(255,255,255,0.15);
            cursor: pointer;
            transition: color 0.2s, transform 0.2s;
        }

        .star-picker label:hover,
        .star-picker label:hover ~ label,
        .star-picker input:checked ~ label {
            color: var(--gold-accent);
            transform: scale(1.1);
        }

        .overall-score-preview {
            background: linear-gradient(135deg, rgba(255, 199, 0, 0.1) 0%, rgba(56, 189, 248, 0.1) 100%);
            border: 1px solid var(--gold-accent);
            border-radius: 14px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .overall-score-preview .score-num {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--gold-accent);
        }

        /* OAuth Lock Wall */
        .oauth-lock-box {
            text-align: center;
            padding: 2rem 1.5rem;
            background: rgba(0,0,0,0.4);
            border-radius: 14px;
            border: 1px dashed var(--border-glass);
        }

        .google-login-btn {
            background: linear-gradient(135deg, #FFF 0%, #E2E8F0 100%);
            color: #0F172A;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 1rem;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }

        .google-login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255,255,255,0.2);
        }

        .submit-review-btn {
            background: linear-gradient(135deg, var(--gold-accent) 0%, #D4A600 100%);
            color: #000;
            border: none;
            padding: 0.85rem 1.8rem;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .loading-state { text-align: center; padding: 6rem 2rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back to Box Office Database
        </a>
        
        <div id="content">
            <div class="loading-state">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2.5rem; color: var(--cyan-accent); margin-bottom: 1rem;"></i>
                <p>Loading Cinematic & Technical Records...</p>
            </div>
        </div>
    </div>

    <script>
        const knownAwards = {
            "Allu Arjun": "National & Gaddar Award Winner",
            "S.S. Rajamouli": "Nandi & National Award Winner",
            "M.M. Keeravani": "Oscar & National Award Winner",
            "Nag Ashwin": "Gaddar & National Award Winner",
            "Sukumar": "National Award Winner",
            "Prabhas": "Nandi Award Winner",
            "Chiranjeevi": "NTR National Award",
            "Kamal Haasan": "Paidi Jairaj Award",
            "Jr NTR": "Nandi Award Winner",
            "Ram Charan": "Nandi Award Winner",
            "Nani": "Nandi Award Winner",
            "K.K. Senthil Kumar": "Nandi Award Winner",
            "Peter Hein": "National Award (Stunts)",
            "King Solomon": "National Award (Stunts)"
        };

        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient(
                "https://eosgvjvpdwxmpxzerxit.supabase.co", 
                "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx"
            );
        }
        const db = window.myFixedClient;

        let fullDatabase = [];
        let currentUser = null;

        async function init() {
            // Check Google OAuth User Session
            const { data: { user } } = await db.auth.getUser();
            currentUser = user;

            const movieId = new URLSearchParams(window.location.search).get('id');
            if (!movieId) {
                document.getElementById('content').innerHTML = `
                    <div class="card" style="text-align:center; padding: 4rem;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 3rem; color: var(--danger); margin-bottom:1rem;"></i>
                        <h2>No Movie Selected</h2>
                    </div>`;
                return;
            }

            const { data: allMovies, error: fetchError } = await db.from('box_office').select('*');
            if (fetchError || !allMovies) {
                document.getElementById('content').innerHTML = `
                    <div class="card" style="text-align:center; padding: 4rem;">
                        <i class="fa-solid fa-server" style="font-size: 3rem; color: var(--danger); margin-bottom:1rem;"></i>
                        <h2>Database Connection Error</h2>
                    </div>`;
                return;
            }
            fullDatabase = allMovies;

            const movieData = allMovies.find(m => m.movie_id == movieId);
            if (!movieData) {
                document.getElementById('content').innerHTML = `
                    <div class="card" style="text-align:center; padding: 4rem;">
                        <i class="fa-solid fa-film" style="font-size: 3rem; color: var(--text-muted); margin-bottom:1rem;"></i>
                        <h2>Movie Record Not Found</h2>
                    </div>`;
                return;
            }

            renderMovieDetails(movieData);
        }

        function handleGoogleLogin() {
            db.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.href }
            });
        }

        function getMovieCount(personName) {
            if (!personName) return 0;
            const cleanName = personName.trim().toLowerCase();
            let count = 0;
            
            fullDatabase.forEach(m => {
                const searchString = [
                    m.starring, m.director, m.producer, m.dop, m.cinematography, 
                    m.stunts, m.music_director, m.supporting_cast, m.side_characters
                ].map(val => (val || '').toLowerCase()).join(' ');

                if (searchString.includes(cleanName)) {
                    count++;
                }
            });
            return count;
        }

        function buildCrewTags(commaSeparatedString, roleLabel) {
            if (!commaSeparatedString || commaSeparatedString === 'N/A' || commaSeparatedString === '-') return '';
            
            const people = commaSeparatedString.split(',').map(s => s.trim()).filter(s => s);
            
            let html = `<div class="crew-list">`;
            people.forEach(person => {
                const count = getMovieCount(person);
                const award = knownAwards[person];
                
                let badgeHtml = count > 1 ? `<span class="movie-count-badge"><i class="fa-solid fa-film"></i> ${count} Movies</span>` : '';
                let awardHtml = award ? `<span class="award-badge"><i class="fa-solid fa-trophy"></i> ${award}</span>` : '';

                html += `
                    <a href="index.html?search=${encodeURIComponent(person)}" class="crew-tag">
                        <span class="crew-role">${roleLabel}</span>
                        <span class="crew-name">${person}</span>
                        <div class="badge-container">
                            ${badgeHtml}
                            ${awardHtml}
                        </div>
                    </a>
                `;
            });
            html += `</div>`;
            return html;
        }

        function calculateOverallScore() {
            const categories = ['direction', 'starring', 'music', 'dop', 'screenplay'];
            let total = 0;
            let count = 0;

            categories.forEach(cat => {
                const checked = document.querySelector(`input[name="rate_${cat}"]:checked`);
                if (checked) {
                    total += parseInt(checked.value);
                    count++;
                }
            });

            const scoreDisplay = document.getElementById('calcOverallScore');
            if (count > 0) {
                const avg = (total / count).toFixed(1);
                scoreDisplay.innerText = `${avg} / 5.0`;
            } else {
                scoreDisplay.innerText = `0.0 / 5.0`;
            }
        }

        function renderMovieDetails(data) {
            const v = (data.verdict || '').toLowerCase();
            const isHit = ['hit', 'blockbuster', 'super', 'all-time'].some(term => v.includes(term));
            const verdictClass = isHit ? 'hit' : 'flop';
            const verdictIcon = isHit ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down';

            const grossValue = data.trade_gross || data.producer_gross || data.worldwide_gross || data.collection || 'TBA';
            const budgetVal = data.budget || 'TBA';

            // Build OAuth Protection Block for Rating System
            let ratingSectionHtml = '';
            if (!currentUser) {
                ratingSectionHtml = `
                    <div class="oauth-lock-box">
                        <i class="fa-solid fa-shield-halved" style="font-size:2rem; color:var(--cyan-accent); margin-bottom:0.5rem;"></i>
                        <h4 style="font-size:1.1rem;">Verified Fan Rating System</h4>
                        <p style="color:var(--text-muted); font-size:0.85rem; margin-top:4px;">Sign in with Google to prevent bot manipulation and submit your breakdown ratings.</p>
                        <button class="google-login-btn" onclick="handleGoogleLogin()">
                            <i class="fa-brands fa-google"></i> Sign In to Rate
                        </button>
                    </div>`;
            } else {
                ratingSectionHtml = `
                    <p style="color:var(--text-muted); font-size:0.82rem; margin-bottom:1rem;">
                        Logged in as <strong style="color:var(--cyan-accent);">${currentUser.email}</strong>
                    </p>

                    <div class="overall-score-preview">
                        <span style="font-size:0.75rem; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; font-weight:700;">Your Calculated Score</span>
                        <div class="score-num" id="calcOverallScore">0.0 / 5.0</div>
                    </div>

                    <form onsubmit="submitBreakdownReview(event)">
                        <div class="category-rating-list">
                            <!-- 1. Direction -->
                            <div class="rating-row">
                                <span class="rating-label"><i class="fa-solid fa-clapperboard" style="color:var(--cyan-accent);"></i> Direction</span>
                                <div class="star-picker" onclick="calculateOverallScore()">
                                    <input type="radio" id="d5" name="rate_direction" value="5"><label for="d5" class="fa-solid fa-star"></label>
                                    <input type="radio" id="d4" name="rate_direction" value="4"><label for="d4" class="fa-solid fa-star"></label>
                                    <input type="radio" id="d3" name="rate_direction" value="3"><label for="d3" class="fa-solid fa-star"></label>
                                    <input type="radio" id="d2" name="rate_direction" value="2"><label for="d2" class="fa-solid fa-star"></label>
                                    <input type="radio" id="d1" name="rate_direction" value="1"><label for="d1" class="fa-solid fa-star"></label>
                                </div>
                            </div>

                            <!-- 2. Starring Performance -->
                            <div class="rating-row">
                                <span class="rating-label"><i class="fa-solid fa-masks-theater" style="color:var(--gold-accent);"></i> Lead & Cast</span>
                                <div class="star-picker" onclick="calculateOverallScore()">
                                    <input type="radio" id="s5" name="rate_starring" value="5"><label for="s5" class="fa-solid fa-star"></label>
                                    <input type="radio" id="s4" name="rate_starring" value="4"><label for="s4" class="fa-solid fa-star"></label>
                                    <input type="radio" id="s3" name="rate_starring" value="3"><label for="s3" class="fa-solid fa-star"></label>
                                    <input type="radio" id="s2" name="rate_starring" value="2"><label for="s2" class="fa-solid fa-star"></label>
                                    <input type="radio" id="s1" name="rate_starring" value="1"><label for="s1" class="fa-solid fa-star"></label>
                                </div>
                            </div>

                            <!-- 3. Music & BGM -->
                            <div class="rating-row">
                                <span class="rating-label"><i class="fa-solid fa-music" style="color:#EC4899;"></i> Music & BGM</span>
                                <div class="star-picker" onclick="calculateOverallScore()">
                                    <input type="radio" id="m5" name="rate_music" value="5"><label for="m5" class="fa-solid fa-star"></label>
                                    <input type="radio" id="m4" name="rate_music" value="4"><label for="m4" class="fa-solid fa-star"></label>
                                    <input type="radio" id="m3" name="rate_music" value="3"><label for="m3" class="fa-solid fa-star"></label>
                                    <input type="radio" id="m2" name="rate_music" value="2"><label for="m2" class="fa-solid fa-star"></label>
                                    <input type="radio" id="m1" name="rate_music" value="1"><label for="m1" class="fa-solid fa-star"></label>
                                </div>
                            </div>

                            <!-- 4. DOP & Visuals -->
                            <div class="rating-row">
                                <span class="rating-label"><i class="fa-solid fa-camera-retro" style="color:#10B981;"></i> DOP & Visuals</span>
                                <div class="star-picker" onclick="calculateOverallScore()">
                                    <input type="radio" id="p5" name="rate_dop" value="5"><label for="p5" class="fa-solid fa-star"></label>
                                    <input type="radio" id="p4" name="rate_dop" value="4"><label for="p4" class="fa-solid fa-star"></label>
                                    <input type="radio" id="p3" name="rate_dop" value="3"><label for="p3" class="fa-solid fa-star"></label>
                                    <input type="radio" id="p2" name="rate_dop" value="2"><label for="p2" class="fa-solid fa-star"></label>
                                    <input type="radio" id="p1" name="rate_dop" value="1"><label for="p1" class="fa-solid fa-star"></label>
                                </div>
                            </div>

                            <!-- 5. Screenplay & Story -->
                            <div class="rating-row">
                                <span class="rating-label"><i class="fa-solid fa-scroll" style="color:#A855F7;"></i> Screenplay</span>
                                <div class="star-picker" onclick="calculateOverallScore()">
                                    <input type="radio" id="sc5" name="rate_screenplay" value="5"><label for="sc5" class="fa-solid fa-star"></label>
                                    <input type="radio" id="sc4" name="rate_screenplay" value="4"><label for="sc4" class="fa-solid fa-star"></label>
                                    <input type="radio" id="sc3" name="rate_screenplay" value="3"><label for="sc3" class="fa-solid fa-star"></label>
                                    <input type="radio" id="sc2" name="rate_screenplay" value="2"><label for="sc2" class="fa-solid fa-star"></label>
                                    <input type="radio" id="sc1" name="rate_screenplay" value="1"><label for="sc1" class="fa-solid fa-star"></label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="submit-review-btn">Submit Technical Rating</button>
                    </form>`;
            }

            let html = `
                <!-- Top Header Banner -->
                <div class="card movie-header-banner">
                    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
                        <div>
                            <h1>${data.movie_name || 'Untitled Project'}</h1>
                            <p style="color:var(--text-muted); font-size:0.95rem;">Telugu Cinema Analytics & Industry Database</p>
                        </div>
                        <span class="verdict-badge ${verdictClass}">
                            <i class="fa-solid ${verdictIcon}"></i> Verdict: ${data.verdict || 'Pending'}
                        </span>
                    </div>
                </div>

                <!-- 2-Column Content Layout -->
                <div class="dashboard-grid">
                    
                    <!-- LEFT COLUMN: Core Cast & Crew Network -->
                    <div class="card">
                        <div class="section-title"><i class="fa-solid fa-users-viewfinder"></i> Cast & Crew Network</div>
                        ${buildCrewTags(data.director, 'Director')}
                        ${buildCrewTags(data.starring, 'Lead Cast')}
                        ${buildCrewTags(data.producer, 'Producer')}
                        ${buildCrewTags(data.music_director, 'Music Director')}
                        ${buildCrewTags(data.dop || data.cinematography, 'Cinematography')}
                        ${buildCrewTags(data.stunts || data.action_director, 'Action / Stunts')}
                        ${buildCrewTags(data.side_characters || data.supporting_cast, 'Supporting Cast')}
                    </div>

                    <!-- RIGHT COLUMN: Financials & Categorized Rating Engine -->
                    <div style="display: flex; flex-direction: column; gap: 1.5rem;">
                        
                        <div class="card">
                            <div class="section-title"><i class="fa-solid fa-chart-line"></i> Financial Economics</div>
                            <div class="finance-vertical">
                                <div class="finance-box">
                                    <span class="label">Production Budget</span>
                                    <span class="val" style="color:var(--text-main); text-shadow:none;">${budgetVal}</span>
                                </div>
                                <div class="finance-box">
                                    <span class="label">Worldwide Trade Gross</span>
                                    <span class="val">${grossValue}</span>
                                </div>
                            </div>
                        </div>

                        <div class="card">
                            <div class="section-title"><i class="fa-solid fa-sliders"></i> Categorized Rating Hub</div>
                            ${ratingSectionHtml}
                        </div>

                    </div>
                </div>
            `;
            
            document.getElementById('content').innerHTML = html;
        }

        function submitBreakdownReview(e) {
            e.preventDefault();
            const scoreText = document.getElementById('calcOverallScore').innerText;
            if (scoreText.startsWith('0.0')) {
                alert("Please select ratings for at least one category before submitting!");
                return;
            }
            alert(`Rating Submitted Successfully!\nYour calculated overall score of ${scoreText} has been tied to your Google session (${currentUser.email}).`);
        }

        init();
    </script>
</body>
</html>
