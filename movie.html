<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft</title>
    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { 
            --bg: #0B0E14; 
            --card: #151921; 
            --gold: #FFD700; 
            --text: #E2E8F0; 
            --blue: #38BDF8; 
            --muted: #94A3B8; 
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 2rem; margin: 0; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: var(--card); padding: 2rem; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .row { display: flex; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #1F2937; }
        .label { color: var(--muted); font-weight: 500; }
        .link { color: var(--blue); text-decoration: none; cursor: pointer; margin-left: 10px; }
        .link:hover { text-decoration: underline; }
        h1 { color: var(--gold); margin-top: 0; font-size: 2rem; }
    </style>
</head>
<body>
    <div class="container" id="content">Loading Movie...</div>

    <script>
        // 1. SAFE INITIALIZATION: Prevents "Identifier already declared" error
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient(
                "https://eosgvjvpdwxmpxzerxit.supabase.co", 
                "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx"
            );
        }
        const db = window.myFixedClient;

        // 2. HELPER: Generates links with the correct 'role' to prevent data mixing
        function renderLink(names, role) {
            if (!names || names === 'N/A') return 'N/A';
            return names.split(',').map(name => {
                const cleanName = name.trim();
                return `<a class="link" href="technician.html?name=${encodeURIComponent(cleanName)}&role=${role}">${cleanName}</a>`;
            }).join(', ');
        }

        // 3. MAIN: Fetch and Display
        async function init() {
            const movieId = new URLSearchParams(window.location.search).get('id');
            if (!movieId) {
                document.getElementById('content').innerHTML = "<h1>No Movie Selected</h1>";
                return;
            }

            const { data, error } = await db.from('box_office').select('*').eq('movie_id', movieId).maybeSingle();
            
            if (error || !data) {
                document.getElementById('content').innerHTML = "<h1>Movie Not Found</h1>";
                return;
            }

            document.getElementById('content').innerHTML = `
                <div class="card">
                    <h1>${data.movie_name}</h1>
                    <div class="row"><span class="label">Director</span><span>${renderLink(data.director, 'director')}</span></div>
                    <div class="row"><span class="label">Producer</span><span>${renderLink(data.producer, 'producer')}</span></div>
                    <div class="row"><span class="label">Starring</span><span>${renderLink(data.starring, 'hero')}</span></div>
                    <div class="row"><span class="label">Music</span><span>${renderLink(data.music_director, 'music')}</span></div>
                    <div class="row"><span class="label">Verdict</span><span style="color:var(--gold)">${data.verdict || 'N/A'}</span></div>
                </div>
            `;
        }
        init();
    </script>
</body>
</html>
