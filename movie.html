<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Details | TeluguCineCraft</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg-base: #05070A; --bg-glass: rgba(15, 20, 28, 0.7); --border-glass: rgba(255, 255, 255, 0.08); --gold-accent: #FFC700; --cyan-accent: #38BDF8; --text-main: #F8FAFC; --text-muted: #94A3B8; }
        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; padding: 2rem; }
        .container { max-width: 1150px; margin: 0 auto; }
        .dashboard-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 2rem; }
        .card { background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass); border-radius: 20px; padding: 2rem; margin-bottom: 1.5rem; }
        .section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--cyan-accent); margin: 1.5rem 0 1rem 0; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 0.5rem; }
        .rating-input { background: rgba(0,0,0,0.3); border: 1px solid var(--border-glass); border-radius: 12px; padding: 1rem; margin-top: 1rem; color: white; width: 100%; }
        .star-rating { display: flex; flex-direction: row-reverse; gap: 10px; cursor: pointer; margin: 1rem 0; }
        .star-rating i { font-size: 1.5rem; color: #333; transition: 0.2s; }
        .star-rating i:hover, .star-rating i:hover ~ i, .star-rating input:checked ~ i { color: var(--gold-accent); }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" style="color:var(--cyan-accent); text-decoration:none;"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
        <div id="content" style="margin-top:2rem;"></div>
    </div>

    <script>
        const db = window.supabase.createClient("https://eosgvjvpdwxmpxzerxit.supabase.co", "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx", { auth: { flowType: 'pkce' } });

        async function init() {
            const id = new URLSearchParams(window.location.search).get('id');
            const { data } = await db.from('box_office').select('*');
            const m = data.find(x => x.movie_id == id);
            const { data: { user } } = await db.auth.getUser();

            document.getElementById('content').innerHTML = `
                <div class="card"><h1>${m.movie_name}</h1><p style="color:var(--cyan-accent)">Verdict: ${m.verdict}</p></div>
                <div class="dashboard-grid">
                    <div class="card">
                        <div class="section-title">Finance & Stats</div>
                        <div class="finance-box"><div style="font-size:0.7rem; color:var(--text-muted)">Budget</div><div class="val">${m.budget || 'TBA'}</div></div>
                        <div class="finance-box"><div style="font-size:0.7rem; color:var(--text-muted)">Worldwide Gross</div><div class="val">${m.trade_gross || 'TBA'}</div></div>
                    </div>
                    <div class="card" id="rating-section">
                        <div class="section-title">Rate this Movie</div>
                        ${user ? `
                            <form id="reviewForm">
                                <div class="star-rating">
                                    ${[5,4,3,2,1].map(n => `<input type="radio" name="stars" value="${n}" id="star${n}" style="display:none;"><label for="star${n}"><i class="fa-solid fa-star"></i></label>`).join('')}
                                </div>
                                <textarea id="reviewText" class="rating-input" placeholder="Write a review (optional)..."></textarea>
                                <button type="submit" style="margin-top:1rem; cursor:pointer;" class="auth-btn">Submit Rating</button>
                            </form>
                        ` : `<p style="color:var(--text-muted)">Please sign in to submit your rating.</p>`}
                    </div>
                </div>
            `;

            if (user) {
                document.getElementById('reviewForm').onsubmit = async (e) => {
                    e.preventDefault();
                    const stars = document.querySelector('input[name="stars"]:checked')?.value;
                    if (!stars) return alert("Please select stars!");
                    await db.from('movie_reviews').insert([{ user_id: user.id, movie_id: id, rating: stars, review: document.getElementById('reviewText').value }]);
                    alert("Rating submitted!");
                };
            }
        }
        init();
    </script>
</body>
</html>
