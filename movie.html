<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Admitad Verification Code -->
    <meta name="verify-admitad" content="3b27ad383c" />
    
    <title>TeluguCineCraft | Verified Trade Dashboard</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client v2 & Shared App Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

    <style>
        :root {
            --bg-base: #06080C; --bg-glass: rgba(18, 24, 38, 0.7); --bg-card: rgba(26, 34, 52, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08); --border-hover: rgba(255, 199, 0, 0.4);
            --gold-accent: #FFC700; --gold-glow: rgba(255, 199, 0, 0.15); --cyan-accent: #38BDF8;
            --text-main: #F8FAFC; --text-muted: #94A3B8; --danger: #EF4444; --success: #22C55E;
            --purple-accent: #C084FC;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 15% 10%, rgba(255, 199, 0, 0.05) 0%, transparent 40%), radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.04) 0%, transparent 40%);
            color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh; padding: 1.2rem 1rem 2rem 1rem; overflow-x: hidden;
        }

        .container { max-width: 1280px; margin: 0 auto; width: 100%; }

        /* --- NAV BAR --- */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1.5rem; background: var(--bg-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid var(--border-glass); border-radius: 16px; margin-bottom: 1.5rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .brand-title { font-size: 1.4rem; font-weight: 900; color: #FFF; display: flex; align-items: center; gap: 8px; letter-spacing: -0.5px; text-decoration: none;}
        .brand-title i { color: var(--gold-accent); }

        .auth-container { display: flex; align-items: center; gap: 12px; }
        .trade-login-link { background: rgba(255,255,255,0.03); border: 1px solid var(--border-glass); color: var(--text-muted); font-size: 0.75rem; font-weight: 800; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px; padding: 0.4rem 0.8rem; border-radius: 8px; cursor: pointer;}
        .trade-login-link:hover { color: #FFF; background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
        .auth-btn { background: rgba(255, 199, 0, 0.12); border: 1px solid var(--gold-accent); color: var(--gold-accent); padding: 0.5rem 1rem; border-radius: 8px; cursor: pointer; font-weight: 800; font-size: 0.8rem; transition: all 0.3s ease; display: flex; align-items: center; gap: 6px; text-transform: uppercase; text-decoration: none;}
        .auth-btn:hover { background: var(--gold-accent); color: #000; box-shadow: 0 0 15px var(--gold-glow); }
        .auth-btn:active { transform: scale(0.95); }
        
        .user-identity { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 0.85rem; color: #FFF; background: rgba(255,255,255,0.05); padding: 0.4rem 0.8rem; border-radius: 8px; border: 1px solid var(--border-glass);}
        .streak-fire { color: #FF6B00; font-weight: 800; display: flex; align-items: center; gap: 4px; margin-left: 5px; background: rgba(255, 107, 0, 0.1); padding: 2px 6px; border-radius: 6px;}
        .signout-btn { background: transparent; border: 1px solid var(--danger); color: var(--danger); padding: 0.4rem 0.6rem; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s ease; }
        .signout-btn:hover { background: rgba(239, 68, 68, 0.1); color: #FFF; }
        .back-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); color: var(--text-main); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 700; font-size: 0.8rem; text-decoration: none; display: flex; align-items: center; gap: 6px; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 0.5px;}
        .back-btn:hover { border-color: var(--cyan-accent); color: var(--cyan-accent); }

        /* --- DASHBOARD LAYOUT --- */
        .movie-dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
        .glass-panel { background: var(--bg-card); backdrop-filter: blur(16px); border: 1px solid var(--border-glass); border-radius: 20px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); display: flex; flex-direction: column; justify-content: space-between; }
        
        .header-panel { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 199, 0, 0.2); padding-bottom: 1.5rem;}
        .movie-header-title { font-size: 2.5rem; font-weight: 900; color: #FFF; line-height: 1.1; letter-spacing: -0.5px;}
        
        .genre-badge { background: rgba(56, 189, 248, 0.1); color: var(--cyan-accent); border: 1px solid rgba(56, 189, 248, 0.2); padding: 0.3rem 0.8rem; border-radius: 8px; font-size: 0.75rem; font-weight: 800; display: inline-block; margin-right: 6px; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .verdict-pill { padding: 0.6rem 1.2rem; border-radius: 12px; font-size: 0.9rem; font-weight: 900; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 5px 15px rgba(0,0,0,0.3);}
        .verdict-pill.blockbuster { background: rgba(34, 197, 94, 0.2); color: #22C55E; border: 1px solid rgba(34, 197, 94, 0.4); }
        .verdict-pill.superhit { background: rgba(255, 199, 0, 0.18); color: #FFC700; border: 1px solid rgba(255, 199, 0, 0.4); }
        .verdict-pill.hit { background: rgba(56, 189, 248, 0.18); color: #38BDF8; border: 1px solid rgba(56, 189, 248, 0.4); }
        .verdict-pill.average { background: rgba(245, 158, 11, 0.18); color: #F59E0B; border: 1px solid rgba(245, 158, 11, 0.4); }
        .verdict-pill.flop { background: rgba(239, 68, 68, 0.18); color: #EF4444; border: 1px solid rgba(239, 68, 68, 0.4); }
        .verdict-pill.disaster { background: rgba(185, 28, 28, 0.25); color: #F87171; border: 1px solid rgba(185, 28, 28, 0.5); }
        .verdict-pill.upcoming { background: rgba(148, 163, 184, 0.15); color: var(--cyan-accent); border: 1px solid rgba(56, 189, 248, 0.3); }

        /* --- CEO: THE TRADE VAULT (VELVET ROPE) --- */
        .financial-gadget { align-self: start; border-top: 4px solid var(--gold-accent); background: linear-gradient(180deg, rgba(18, 24, 38, 0.95) 0%, rgba(10, 15, 25, 0.95) 100%); box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8); position: relative;}
        .public-gross-box { text-align: center; padding: 1rem 0; margin-bottom: 1rem; border-bottom: 1px dashed var(--border-glass); }
        .public-gross-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 5px;}
        .public-gross-value { font-size: 2.2rem; font-weight: 900; color: var(--success); text-shadow: 0 0 20px rgba(34, 197, 94, 0.3);}
        
        .trade-vault { position: relative; background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-glass); border-radius: 16px; padding: 1.2rem; overflow: hidden; }
        .blur-data { filter: blur(8px); opacity: 0.3; pointer-events: none; user-select: none; }
        .velvet-rope-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(6, 8, 12, 0.7); backdrop-filter: blur(2px); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 1rem; }
        .velvet-rope-icon { font-size: 2rem; color: var(--gold-accent); margin-bottom: 8px; filter: drop-shadow(0 0 10px var(--gold-glow));}
        .velvet-rope-title { font-size: 1.1rem; font-weight: 900; color: #FFF; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px;}
        .velvet-rope-text { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; line-height: 1.4; font-weight: 500;}
        .unlock-btn { background: linear-gradient(135deg, var(--gold-accent), #E6B300); color: #000; border: none; padding: 0.7rem 1.5rem; border-radius: 10px; font-weight: 900; cursor: pointer; transition: transform 0.2s; font-size: 0.85rem; display: flex; align-items: center; gap: 8px; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 5px 15px rgba(255,199,0,0.3);}
        .unlock-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,199,0,0.5); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
        .stat-box { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-glass); padding: 0.8rem; border-radius: 12px; text-align: center; }
        .stat-box-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.3rem; font-weight: 700;}
        .stat-box-value { font-size: 1.1rem; font-weight: 900; color: var(--gold-accent); }

        /* --- CREW PANELS --- */
        .panel-title { font-size: 1.1rem; font-weight: 900; color: var(--cyan-accent); margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.6rem; }
        .person-row { display: flex; flex-direction: column; gap: 0.3rem; padding: 0.6rem 0; border-bottom: 1px dashed rgba(255, 255, 255, 0.05); }
        .person-row:last-child { border-bottom: none; }
        .person-role { font-size: 0.7rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700; letter-spacing: 0.5px; }
        .person-card-link { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-glass); padding: 0.6rem 0.8rem; border-radius: 12px; text-decoration: none; color: var(--text-main); transition: all 0.2s ease; }
        .person-card-link:hover { background: rgba(255, 199, 0, 0.08); border-color: var(--gold-accent); transform: translateX(3px); }
        
        .person-name { font-weight: 800; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }
        .person-badges { display: flex; align-items: center; gap: 4px; }
        .film-count-badge { background: rgba(56, 189, 248, 0.12); color: var(--cyan-accent); border: 1px solid rgba(56, 189, 248, 0.3); font-size: 0.65rem; font-weight: 800; padding: 0.15rem 0.5rem; border-radius: 6px; white-space: nowrap; }
        .award-badge { background: rgba(255, 199, 0, 0.12); color: var(--gold-accent); border: 1px solid rgba(255, 199, 0, 0.3); font-size: 0.65rem; font-weight: 800; padding: 0.15rem 0.5rem; border-radius: 6px; white-space: nowrap; }

        /* --- RATINGS --- */
        .rating-panel { grid-column: 1 / -1; margin-top: 0.5rem; background: linear-gradient(135deg, rgba(18, 24, 38, 0.8) 0%, rgba(10, 15, 25, 0.95) 100%); border: 1px solid var(--border-glass); border-radius: 20px; padding: 2rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .rating-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; margin-bottom: 1.5rem; }
        .param-card { background: rgba(0, 0, 0, 0.4); border: 1px solid var(--border-glass); border-radius: 16px; padding: 1rem 1.2rem; display: flex; flex-direction: column; justify-content: space-between; }
        .param-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
        .param-name { font-size: 0.85rem; font-weight: 800; color: #FFF; }
        .star-rating { display: flex; gap: 4px; color: rgba(255, 255, 255, 0.1); cursor: pointer; }
        .star-rating i { transition: all 0.2s ease; font-size: 1.2rem; }
        .star-rating i.active, .star-rating i:hover { color: var(--gold-accent); text-shadow: 0 0 10px var(--gold-glow); }
        .review-input { width: 100%; background: rgba(0, 0, 0, 0.5); border: 1px solid var(--border-glass); border-radius: 16px; padding: 1rem; color: var(--text-main); font-family: inherit; font-size: 0.95rem; outline: none; resize: none; height: 90px; transition: all 0.3s ease; }
        .review-input:focus { border-color: var(--gold-accent); box-shadow: 0 0 15px var(--gold-glow); }
        .submit-review-btn { align-self: flex-end; background: var(--cyan-accent); color: #000; border: none; padding: 0.8rem 1.5rem; border-radius: 12px; font-weight: 900; cursor: pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; margin-top: 15px;}
        .submit-review-btn:hover { box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); transform: translateY(-2px); }

        .auth-overlay-gate { background: rgba(6, 8, 12, 0.85); backdrop-filter: blur(8px); border: 1px dashed var(--gold-accent); border-radius: 20px; padding: 2rem; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
        
        .loading-view { text-align: center; padding: 8rem 0; color: var(--text-muted); font-size: 1.2rem; font-weight: 700;}

        @media (max-width: 1200px) { .movie-dashboard { grid-template-columns: 1fr 1fr; } .financial-gadget { align-self: stretch; } }
        @media (max-width: 768px) { 
            body { padding: 0.8rem; } 
            .movie-dashboard { grid-template-columns: 1fr; } 
            .movie-header-title { font-size: 2rem; } 
            .header-panel { flex-direction: column; align-items: flex-start; gap: 15px;} 
            nav { flex-direction: column; padding: 1.2rem; border-radius: 15px; align-items: stretch; gap: 15px;}
            .auth-container { flex-direction: column-reverse; width: 100%; align-items: stretch;}
            .auth-btn, .back-btn, .trade-login-link { justify-content: center;}
            .user-identity { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- CEO PREMIUM NAV -->
        <nav>
            <a href="index.html" class="brand-title"><i class="fa-solid fa-film"></i> TeluguCineCraft</a>
            <div class="nav-actions">
                <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Home</a>
                <div id="userMenuArea" class="auth-container"></div>
            </div>
        </nav>

        <div id="movieDetailsArea" class="loading-view">
            <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--gold-accent)"></i>
            <p style="margin-top: 15px;">Decrypting trade records...</p>
        </div>
    </div>

    <script>
        let globalUser = null;
        let selectedRatings = { story: 0, direction: 0, performance: 0, music: 0, vfx: 0 };

        function getMovieId() { const params = new URLSearchParams(window.location.search); return params.get('id'); }
        
        function calculateAndGetStreak(userId) {
            const today = new Date().toDateString();
            const yesterday = new Date(Date.now() - 86400000).toDateString();
            let lastVisit = localStorage.getItem(`lastVisit_${userId}`);
            let storedStreak = parseInt(localStorage.getItem(`streak_${userId}`)) || 0;
            let newStreak = (lastVisit === yesterday) ? storedStreak + 1 : (lastVisit === today ? storedStreak || 1 : 1);
            localStorage.setItem(`lastVisit_${userId}`, today);
            localStorage.setItem(`streak_${userId}`, newStreak);
            return newStreak;
        }

        async function updateAuthUI() {
            try {
                const { data: { user } } = await db.auth.getUser();
                globalUser = user;
                const area = document.getElementById('userMenuArea');
                
                if (user) {
                    const streakCount = calculateAndGetStreak(user.id);
                    let baseName = user.user_metadata.full_name || user.email.split('@')[0];
                    let shortName = baseName.split(' ')[0].substring(0, 10); 

                    area.innerHTML = `
                        <div class="user-identity">
                            <i class="fa-solid fa-user-astronaut" style="color:var(--cyan-accent)"></i> ${shortName}
                            <span class="streak-fire"><i class="fa-solid fa-fire"></i> ${streakCount}</span>
                        </div>
                        <button class="signout-btn" title="Sign Out" onclick="signOutUser()"><i class="fa-solid fa-right-from-bracket"></i></button>
                    `;
                } else {
                    area.innerHTML = `
                        <button class="auth-btn" onclick="handleGoogleLogin()"><i class="fa-solid fa-lock-open"></i> Unlock Trade Access</button>
                    `;
                }
            } catch (err) {}
        }

        async function handleGoogleLogin() { await db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); }
        async function signOutUser() { await db.auth.signOut(); window.location.reload(); }

        // MOCK DATA FETCHERS
        async function getFilmCount(name) { return Math.floor(Math.random() * 15) + 1 + ' Movies'; }
        function getAwardHighlight(name) { return `<span class="award-badge"><i class="fa-solid fa-trophy"></i> Elite</span>`; }
        function createRow(title, content) {
            if (!content) return ''; 
            return `<div class="person-row"><div class="person-role"><span>${title}</span></div>${content}</div>`;
        }

        async function renderPersonList(rawString, iconClass, iconColor) {
            if (!rawString || rawString.trim() === '' || rawString === 'N/A') return '';
            const names = rawString.split(/[,;\n/]+/).map(s => s.trim()).filter(s => s.length > 0);
            
            if (names.length === 1) {
                return `<a href="#" class="person-card-link"><span class="person-name"><i class="${iconClass}" style="color:${iconColor}"></i> ${names[0]}</span><div class="person-badges"><span class="film-count-badge">Pro</span></div></a>`;
            } else {
                return `<div style="display:flex; flex-direction:column; gap:5px;">` + names.map(name => `<a href="#" class="person-card-link" style="padding: 0.4rem 0.6rem;"><span class="person-name" style="font-size:0.8rem;"><i class="${iconClass}" style="color:${iconColor}"></i> ${name}</span></a>`).join('') + `</div>`;
            }
        }

        async function fetchMovieDetails() {
            await updateAuthUI(); // Wait for Auth first to know if we blur or not
            
            const id = getMovieId();
            if (!id) { document.getElementById('movieDetailsArea').innerHTML = `<div style="text-align:center; color:var(--danger); padding:4rem; font-weight:800; font-size:1.2rem;">NO MOVIE ID DETECTED</div>`; return; }

            let { data, error } = await db.from('box_office').select('*').eq('movie_id', id).single();
            if (error || !data) { const res = await db.from('movies').select('*').or(`movie_id.eq.${id},id.eq.${id}`).single(); data = res.data; error = res.error; }

            if (error || !data) { document.getElementById('movieDetailsArea').innerHTML = `<div style="text-align:center; color:var(--danger); padding:4rem; font-weight:800; font-size:1.2rem;">RECORDS RESTRICTED OR MOVED</div>`; return; }

            await renderMovieDashboard(data);
        }

        async function renderMovieDashboard(m) {
            const title = m.movie_name || m.title || 'Classified Title';
            const releaseDate = extractYear(m) || m.release_date || 'TBA';
            const genres = m.genre ? m.genre.split(',').map(g => g.trim()) : ['Cinema'];
            const genreHtml = genres.map(g => `<span class="genre-badge">${g}</span>`).join('');
            
            const verdictObj = (typeof getVerdict === 'function') ? getVerdict(m) : { label: 'TBA', badgeClass: 'verdict-badge upcoming' };
            const verdict = verdictObj.label;
            const verdictClass = "verdict-pill " + verdictObj.label.toLowerCase().replace(/\s+/g, '');

            // Trade Data
            const budget = m.budget || 'N/A';
            const gross = m.collection || m.trade_gross || m.worldwide_gross || 'TBA';
            const budgetNum = parseAmount(budget); const grossNum = parseAmount(gross);
            let roiDisplay = 'N/A'; let recoveryDisplay = 'N/A';
            if (budgetNum && grossNum && budgetNum > 0) {
                const profit = grossNum - budgetNum;
                recoveryDisplay = (grossNum / budgetNum).toFixed(2) + 'x';
                roiDisplay = profit >= 0 ? `+${((profit / budgetNum) * 100).toFixed(0)}%` : `${((profit / budgetNum) * 100).toFixed(0)}%`;
            }

            // Crew Html
            const heroHtml = await renderPersonList(m.hero || m.starring, 'fa-solid fa-user-astronaut', 'var(--gold-accent)');
            const directorHtml = await renderPersonList(m.director, 'fa-solid fa-video', 'var(--gold-accent)');
            const musicHtml = await renderPersonList(m.music_director || m.music, 'fa-solid fa-music', 'var(--cyan-accent)');
            const producerHtml = await renderPersonList(m.producer || m.banner, 'fa-solid fa-building', 'var(--text-muted)');

            const html = `
                <div class="movie-dashboard">
                    <!-- HEADER -->
                    <div class="glass-panel header-panel">
                        <div>
                            <div class="movie-header-title">${title}</div>
                            <div style="color: var(--text-muted); font-size: 0.95rem; margin-top: 6px; font-weight:600;">
                                <i class="fa-regular fa-calendar" style="color:var(--cyan-accent)"></i> Vintage: ${releaseDate}
                            </div>
                            <div>${genreHtml}</div>
                        </div>
                        <div class="${verdictClass}">${verdict}</div>
                    </div>

                    <!-- CEO: THE VELVET ROPE TRADE VAULT -->
                    <div class="glass-panel financial-gadget">
                        <div class="panel-title"><i class="fa-solid fa-vault"></i> Verified Box Office</div>
                        
                        <!-- Always Public: The Bait -->
                        <div class="public-gross-box">
                            <div class="public-gross-label">Worldwide Gross Collection</div>
                            <div class="public-gross-value">${gross}</div>
                        </div>

                        <!-- The Velvet Rope Area -->
                        <div class="trade-vault">
                            ${!globalUser ? `
                                <!-- Locked View -->
                                <div class="velvet-rope-overlay">
                                    <i class="fa-solid fa-lock velvet-rope-icon"></i>
                                    <div class="velvet-rope-title">Trade Secrets Locked</div>
                                    <div class="velvet-rope-text">Sign in to uncover actual budget reports, ROI margins, and hidden recovery ratios.</div>
                                    <button class="unlock-btn" onclick="handleGoogleLogin()">
                                        <i class="fa-solid fa-key"></i> Unlock Dashboard
                                    </button>
                                </div>
                                <!-- Blurred Data underneath -->
                                <div class="stats-grid blur-data">
                                    <div class="stat-box"><div class="stat-box-label">Production Cost</div><div class="stat-value">₹150 Cr</div></div>
                                    <div class="stat-box"><div class="stat-box-label">Nizam Share</div><div class="stat-value">₹45 Cr</div></div>
                                    <div class="stat-box"><div class="stat-box-label">Profit / ROI</div><div class="stat-value">+120%</div></div>
                                    <div class="stat-box"><div class="stat-box-label">Recovery</div><div class="stat-value">2.4x</div></div>
                                </div>
                            ` : `
                                <!-- Unlocked View (Logged In) -->
                                <div class="stats-grid">
                                    <div class="stat-box">
                                        <div class="stat-box-label">Reported Budget</div>
                                        <div class="stat-box-value">${budget}</div>
                                    </div>
                                    <div class="stat-box">
                                        <div class="stat-box-label">Profit / ROI</div>
                                        <div class="stat-box-value" style="color: ${roiDisplay.startsWith('+') ? 'var(--success)' : 'var(--gold-accent)'};">${roiDisplay}</div>
                                    </div>
                                    <div class="stat-box">
                                        <div class="stat-box-label">Recovery Ratio</div>
                                        <div class="stat-box-value" style="color:#FFF;">${recoveryDisplay}</div>
                                    </div>
                                    <div class="stat-box">
                                        <div class="stat-box-label">Trade Status</div>
                                        <div class="stat-box-value" style="color:var(--cyan-accent); font-size:0.8rem; display:flex; align-items:center; justify-content:center; height:100%;">
                                            <i class="fa-solid fa-circle-check" style="margin-right:4px;"></i> Verified
                                        </div>
                                    </div>
                                </div>
                            `}
                        </div>
                    </div>

                    <!-- CREW PANELS -->
                    <div class="glass-panel">
                        <div class="panel-title"><i class="fa-solid fa-masks-theater"></i> Leading Cast</div>
                        ${createRow('Primary Star', heroHtml)}
                        <div style="margin-top:15px; padding:10px; background:rgba(255,255,255,0.03); border-radius:12px; border:1px dashed var(--border-glass); text-align:center; font-size:0.75rem; color:var(--text-muted);">
                            <i class="fa-solid fa-lock" style="color:var(--gold-accent); margin-bottom:5px;"></i><br>
                            Detailed supporting cast and antagonist data available exclusively in the Pro Industry Terminal.
                        </div>
                    </div>

                    <div class="glass-panel">
                        <div class="panel-title"><i class="fa-solid fa-video"></i> Production Core</div>
                        ${createRow('Captain of the Ship', directorHtml)}
                        ${createRow('Music & Score', musicHtml)}
                        ${createRow('Financed By', producerHtml)}
                    </div>

                    <!-- 5-PARAMETER RATING SECTION -->
                    <div class="rating-panel">
                        <div class="panel-title" style="margin-bottom: 1.5rem; font-size:1.3rem;">
                            <i class="fa-solid fa-star" style="color:var(--gold-accent)"></i> Rate The Cinematic Experience
                        </div>

                        ${globalUser ? `
                            <div class="rating-grid">
                                <div class="param-card"><div class="param-header"><span class="param-name">1. Screenplay</span><span style="font-weight:900; color:var(--gold-accent)" id="val-story">0/5</span></div><div class="star-rating" onclick="setParamRating('story', event)"><i class="fa-solid fa-star" data-v="1"></i><i class="fa-solid fa-star" data-v="2"></i><i class="fa-solid fa-star" data-v="3"></i><i class="fa-solid fa-star" data-v="4"></i><i class="fa-solid fa-star" data-v="5"></i></div></div>
                                <div class="param-card"><div class="param-header"><span class="param-name">2. Direction</span><span style="font-weight:900; color:var(--gold-accent)" id="val-direction">0/5</span></div><div class="star-rating" onclick="setParamRating('direction', event)"><i class="fa-solid fa-star" data-v="1"></i><i class="fa-solid fa-star" data-v="2"></i><i class="fa-solid fa-star" data-v="3"></i><i class="fa-solid fa-star" data-v="4"></i><i class="fa-solid fa-star" data-v="5"></i></div></div>
                                <div class="param-card"><div class="param-header"><span class="param-name">3. Performances</span><span style="font-weight:900; color:var(--gold-accent)" id="val-performance">0/5</span></div><div class="star-rating" onclick="setParamRating('performance', event)"><i class="fa-solid fa-star" data-v="1"></i><i class="fa-solid fa-star" data-v="2"></i><i class="fa-solid fa-star" data-v="3"></i><i class="fa-solid fa-star" data-v="4"></i><i class="fa-solid fa-star" data-v="5"></i></div></div>
                                <div class="param-card"><div class="param-header"><span class="param-name">4. BGM Score</span><span style="font-weight:900; color:var(--gold-accent)" id="val-music">0/5</span></div><div class="star-rating" onclick="setParamRating('music', event)"><i class="fa-solid fa-star" data-v="1"></i><i class="fa-solid fa-star" data-v="2"></i><i class="fa-solid fa-star" data-v="3"></i><i class="fa-solid fa-star" data-v="4"></i><i class="fa-solid fa-star" data-v="5"></i></div></div>
                            </div>
                            <div style="display:flex; flex-direction:column;">
                                <textarea class="review-input" id="reviewText" placeholder="Write your detailed review to boost your Analyst Streak..."></textarea>
                                <button class="submit-review-btn" onclick="submitReview()">
                                    <i class="fa-solid fa-paper-plane"></i> Lock in Rating
                                </button>
                            </div>
                        ` : `
                            <div class="auth-overlay-gate">
                                <i class="fa-solid fa-lock fa-2x" style="color:var(--gold-accent); filter:drop-shadow(0 0 10px rgba(255,199,0,0.5))"></i>
                                <p style="font-weight:900; font-size:1.2rem; color:#FFF; margin-top:10px;">Ratings Locked</p>
                                <p style="font-size:0.9rem; color:var(--text-muted); max-width:400px; line-height:1.4;">Only Verified Fans and Industry Analysts can rate movies on this platform to prevent review bombing.</p>
                                <button class="auth-btn" style="margin-top:15px; padding: 0.8rem 2rem; font-size:0.9rem;" onclick="handleGoogleLogin()">
                                    <i class="fa-solid fa-key"></i> Sign In to Rate
                                </button>
                            </div>
                        `}
                    </div>
                </div>
            `;
            document.getElementById('movieDetailsArea').innerHTML = html;
        }

        function setParamRating(param, event) {
            const star = event.target;
            if (!star.dataset.v) return;
            const val = parseInt(star.dataset.v);
            selectedRatings[param] = val;
            document.getElementById(`val-${param}`).innerText = `${val}/5`;
            const stars = star.parentElement.querySelectorAll('i');
            stars.forEach((s, idx) => { idx < val ? s.classList.add('active') : s.classList.remove('active'); });
        }

        async function submitReview() {
            alert("🔥 Phenomenal! Your review has been recorded. +1 added to your Analyst Streak.");
        }

        fetchMovieDetails();
    </script>
</body>
</html>
