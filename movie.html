<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TeluguCineCraft | Personal Cinema Dashboard</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-base: #06080C;
            --bg-glass: rgba(18, 24, 38, 0.75);
            --bg-card: rgba(26, 34, 52, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 199, 0, 0.4);
            --gold-accent: #FFC700;
            --gold-glow: rgba(255, 199, 0, 0.15);
            --cyan-accent: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --danger: #EF4444;
            --success: #22C55E;
            --purple-accent: #C084FC;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 0.8rem; /* Reduced padding */
        }

        .container { max-width: 1350px; margin: 0 auto; width: 100%; }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.2rem; /* Compact nav */
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            margin-bottom: 0.8rem;
        }

        .brand-title { font-size: 1.2rem; font-weight: 800; color: #FFF; display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .nav-actions { display: flex; align-items: center; gap: 10px; }

        /* --- DASHBOARD GRID --- */
        .movie-dashboard { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.8rem; } /* Tightened grid gap */

        .glass-panel {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            padding: 0.8rem 1rem; /* Compacted panels */
        }

        .header-panel { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255, 199, 0, 0.15); padding-bottom: 0.8rem; }
        .movie-header-title { font-size: 1.8rem; font-weight: 800; }
        
        .verdict-pill { background: rgba(34, 197, 94, 0.1); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.2); padding: 0.3rem 0.8rem; border-radius: 15px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .verdict-pill.upcoming { background: rgba(148, 163, 184, 0.1); color: var(--cyan-accent); border: 1px solid rgba(56, 189, 248, 0.2); }

        /* Stats & Panels */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-top: 0.5rem; }
        .stat-box { background: rgba(0, 0, 0, 0.2); padding: 0.5rem; border-radius: 8px; text-align: center; }
        .stat-box-label { font-size: 0.6rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-box-value { font-size: 0.9rem; font-weight: 700; color: var(--gold-accent); }

        .panel-title { font-size: 0.85rem; font-weight: 700; color: var(--cyan-accent); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px; }
        
        /* Person Rows */
        .person-row { padding: 0.3rem 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
        .person-role { font-size: 0.65rem; text-transform: uppercase; color: var(--text-muted); margin-bottom: 2px; }
        .person-card-link { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.02); padding: 0.3rem 0.5rem; border-radius: 6px; text-decoration: none; color: var(--text-main); font-size: 0.8rem; }
        
        /* Album Verdict Badges */
        .album-verdict-badge { font-size: 0.65rem; font-weight: 800; padding: 0.15rem 0.4rem; border-radius: 4px; text-transform: uppercase; }
        .album-verdict-badge.blockbuster { color: var(--gold-accent); border: 1px solid var(--gold-accent); }
        .album-verdict-badge.hit { color: var(--success); border: 1px solid var(--success); }
        .album-verdict-badge.average { color: var(--cyan-accent); border: 1px solid var(--cyan-accent); }

        /* Ratings */
        .rating-panel { grid-column: 1 / -1; margin-top: 0.5rem; background: rgba(18, 24, 38, 0.6); border: 1px solid var(--border-glass); border-radius: 12px; padding: 1rem; }
        .rating-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-bottom: 1rem; }
        .param-card { background: rgba(0,0,0,0.2); padding: 0.5rem; border-radius: 8px; }
        .param-name { font-size: 0.75rem; font-weight: 700; margin-bottom: 5px; display: block; }
        .star-rating { font-size: 0.8rem; }
        
        .review-input { font-size: 0.8rem; padding: 0.5rem; height: 50px; }
        .submit-review-btn { padding: 0.4rem 1rem; font-size: 0.85rem; }

        @media (max-width: 1024px) { .movie-dashboard { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 600px) { .movie-dashboard { grid-template-columns: 1fr; } .rating-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html" class="brand-title"><i class="fa-solid fa-film"></i> TeluguCineCraft</a>
            <div class="nav-actions">
                <div id="authStatusArea"></div>
                <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
            </div>
        </nav>
        <div id="movieDetailsArea" class="loading-view"><i class="fa-solid fa-spinner fa-spin"></i></div>
    </div>

    <script>
        const db = window.supabase.createClient(
            "https://eosgvjvpdwxmpxzerxit.supabase.co", 
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc2d2anZwZHd4bXB4emVyeGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Njk3MTMsImV4cCI6MjEwMTE0NTcxM30.fD14BdJBDPNqFUKGxS5DRgsDnN8CqYdWR4k8cuAbvcg",
            { auth: { flowType: 'pkce' } }
        );

        let currentUser = null;
        let selectedRatings = { story: 0, direction: 0, performance: 0, music: 0, vfx: 0 };

        function getMovieId() { const params = new URLSearchParams(window.location.search); return params.get('id'); }
        async function checkUserAuth() {
            const { data: { user } } = await db.auth.getUser(); currentUser = user;
            const authArea = document.getElementById('authStatusArea');
            if (user) {
                authArea.innerHTML = `<button class="signout-btn" onclick="signOutUser()">Sign Out</button>`;
            } else {
                authArea.innerHTML = `<button class="auth-btn" onclick="triggerGoogleLogin()">Sign In</button>`;
            }
        }

        async function triggerGoogleLogin() { await db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); }
        async function signOutUser() { await db.auth.signOut(); window.location.reload(); }

        // Helper to format Album Verdict with Matching Color Badges
        function getAlbumVerdictBadge(rawVerdict, isUnreleased) {
            if (isUnreleased) return `<span class="album-verdict-badge upcoming">UPCOMING</span>`;
            if (!rawVerdict) return `<span class="album-verdict-badge average">HIT ALBUM</span>`;

            const str = rawVerdict.toString().toUpperCase().trim();
            if (str.includes('BLOCKBUSTER')) return `<span class="album-verdict-badge blockbuster">${str}</span>`;
            if (str.includes('HIT')) return `<span class="album-verdict-badge hit">${str}</span>`;
            if (str.includes('AVERAGE')) return `<span class="album-verdict-badge average">${str}</span>`;
            return `<span class="album-verdict-badge average">${str}</span>`;
        }

        async function fetchMovieDetails() {
            await checkUserAuth();
            const id = getMovieId();
            let { data, error } = await db.from('box_office').select('*').eq('movie_id', id).single();
            if (error || !data) {
                const res = await db.from('movies').select('*').or(`movie_id.eq.${id},id.eq.${id}`).single();
                data = res.data;
            }
            if (data) renderMovieDashboard(data);
        }

        async function renderMovieDashboard(m) {
            const title = m.movie_name || 'Untitled';
            const verdict = (m.collection === 'TBA' || !m.collection) ? 'UPCOMING' : (m.verdict || 'Blockbuster');
            const verdictClass = verdict === 'UPCOMING' ? 'verdict-pill upcoming' : 'verdict-pill';
            
            const albumBadgeHTML = getAlbumVerdictBadge(m.album_verdict, verdict === 'UPCOMING');

            const html = `
                <div class="movie-dashboard">
                    <div class="glass-panel header-panel">
                        <div><div class="movie-header-title">${title}</div></div>
                        <div class="${verdictClass}">${verdict}</div>
                    </div>

                    <!-- Panel 1 -->
                    <div class="glass-panel">
                        <div class="panel-title">Financial Metrics</div>
                        <div class="stats-grid">
                            <div class="stat-box"><div class="stat-box-label">Budget</div><div class="stat-box-value">${m.budget || 'N/A'}</div></div>
                            <div class="stat-box"><div class="stat-box-label">Gross</div><div class="stat-box-value">${m.collection || 'N/A'}</div></div>
                        </div>
                    </div>

                    <!-- Panel 2 -->
                    <div class="glass-panel">
                        <div class="panel-title">Star Ensemble</div>
                        <div class="person-row"><div class="person-role">Hero</div><div class="person-card-link"><span class="person-name">${m.hero || 'N/A'}</span></div></div>
                        <div class="person-row"><div class="person-role">Heroine</div><div class="person-card-link"><span class="person-name">${m.heroine || 'N/A'}</span></div></div>
                        <div class="person-row"><div class="person-role">Villain</div><div class="person-card-link"><span class="person-name">${m.villain || 'N/A'}</span></div></div>
                    </div>

                    <!-- Panel 3 -->
                    <div class="glass-panel">
                        <div class="panel-title">Technical</div>
                        <div class="person-row"><div class="person-role">DOP</div><div class="person-card-link"><span class="person-name">${m.dop || 'N/A'}</span></div></div>
                        <div class="person-row"><div class="person-role">Stunts</div><div class="person-card-link"><span class="person-name">${m.stunt_director || 'N/A'}</span></div></div>
                        <div class="person-row"><div class="person-role">VFX</div><div class="person-card-link"><span class="person-name">${m.vfx_team || 'N/A'}</span></div></div>
                    </div>

                    <!-- Panel 4 -->
                    <div class="glass-panel">
                        <div class="panel-title">Direction & Music ${albumBadgeHTML}</div>
                        <div class="person-row"><div class="person-role">Director</div><div class="person-card-link"><span class="person-name">${m.director || 'N/A'}</span></div></div>
                        <div class="person-row"><div class="person-role">Music Director</div><div class="person-card-link"><span class="person-name">${m.music_director || 'N/A'}</span></div></div>
                        <div class="person-row"><div class="person-role">Playback</div><div class="person-card-link" style="font-size:0.7rem;">${m.playback_singers || 'N/A'}</div></div>
                    </div>
                </div>
            `;
            document.getElementById('movieDetailsArea').innerHTML = html;
        }

        fetchMovieDetails();
    </script>
</body>
</html>
