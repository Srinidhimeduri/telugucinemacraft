<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft | TFI Trade & Craft Analytics</title>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #0B0F19;
            --card-bg: #1E293B;
            --accent-gold: #FBBF24;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --border-color: #334155;
            --hit-green: #22C55E;
            --verdict-orange: #F97316;
            --mvp-purple: #A855F7;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            background-color: #0F172A;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .nav-logo {
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
        }

        .btn-signin {
            background-color: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-signin:hover {
            background-color: var(--accent-gold);
            color: #000;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: 2.5rem 0;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 2.5rem;
            margin: 0 0 0.5rem 0;
        }

        p.subtitle {
            color: var(--text-sub);
            font-size: 1.1rem;
            margin: 0;
        }

        .controls-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .search-input {
            flex: 1;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
        }

        .table-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #0F172A;
            color: var(--accent-gold);
            padding: 16px;
            font-size: 0.85rem;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            vertical-align: top;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .movie-link {
            color: var(--text-main);
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
        }

        .movie-link:hover {
            color: var(--accent-gold);
            text-decoration: underline;
        }

        .tag {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
        }

        .tag.blockbuster { background-color: rgba(34, 197, 94, 0.15); color: var(--hit-green); border: 1px solid var(--hit-green); }
        .tag.average { background-color: rgba(249, 115, 22, 0.15); color: var(--verdict-orange); border: 1px solid var(--verdict-orange); }

        .gross {
            font-family: monospace;
            font-size: 1rem;
            font-weight: 600;
            color: var(--accent-gold);
        }

        .mvp-badge {
            display: inline-block;
            background-color: rgba(168, 85, 247, 0.15);
            color: #C084FC;
            border: 1px solid var(--mvp-purple);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .mvp-reason {
            font-size: 0.8rem;
            color: var(--text-sub);
            line-height: 1.3;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">TeluguCineCraft</a>
        <div id="authContainer">
            <button class="btn-signin" id="btnAuth" onclick="handleAuth()">Sign In with Google</button>
        </div>
    </nav>

    <div class="container">
        <header>
            <h1>TFI Box Office & Craft Index</h1>
            <p class="subtitle">Live cloud database integration via Supabase</p>
        </header>

        <div class="controls-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search by movie, actor, director..." onkeyup="filterTable()">
        </div>

        <div class="table-card">
            <table id="movieTable">
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Movie Title</th>
                        <th>Craft MVP</th>
                        <th>WW Gross</th>
                        <th>Verdict</th>
                    </tr>
                </thead>
                <tbody id="movieTableBody">
                    <tr><td colspan="5" style="text-align:center; color: var(--text-sub);">Connecting to Supabase Database...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Initialize Supabase Client
        const SUPABASE_URL = "https://eosgvjvpdwxmpxzerxit.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc2d2anZwZHd4bXB4emVyeGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Njk3MTMsImV4cCI6MjEwMTE0NTcxM30.fD14BdJBDPNqFUKGxS5DRgsDnN8CqYdWR4k8cuAbvcg";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Fetch Movies from Cloud Database
        async function fetchMovies() {
            const { data: movies, error } = await supabaseClient.from('movies').select('*');
            const tbody = document.getElementById('movieTableBody');

            if (error || !movies || movies.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">No database records found. Run Seed Script in Supabase!</td></tr>`;
                return;
            }

            tbody.innerHTML = "";
            movies.forEach((movie, index) => {
                const rank = (index + 1).toString().padStart(2, '0');
                tbody.innerHTML += `
                    <tr>
                        <td>${rank}</td>
                        <td>
                            <a href="movie.html?id=${movie.id}" class="movie-link">${movie.title}</a><br>
                            <span style="font-size: 0.85rem; color: var(--text-sub);">${movie.starring || ''} / ${movie.director || ''}</span>
                        </td>
                        <td>
                            <span class="mvp-badge">${movie.mvp_badge || '⚡ Craft Spotlight'}</span>
                            <div class="mvp-reason">${movie.mvp_reason || ''}</div>
                        </td>
                        <td class="gross">${movie.ww_gross || 'TBD'}</td>
                        <td><span class="tag blockbuster">${movie.verdict || 'Tracked'}</span></td>
                    </tr>
                `;
            });
        }

        // Google Auth Handler Placeholder
        async function handleAuth() {
            const { data, error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
            });
        }

        function filterTable() {
            const filter = document.getElementById("searchInput").value.toLowerCase();
            const tr = document.getElementById("movieTable").getElementsByTagName("tr");
            for (let i = 1; i < tr.length; i++) {
                tr[i].style.display = tr[i].innerText.toLowerCase().includes(filter) ? "" : "none";
            }
        }

        fetchMovies();
    </script>
</body>
</html>
