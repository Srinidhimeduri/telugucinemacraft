<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TeluguCineCraft | Box Office Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0B0E14; --gold: #FFD700; --text: #E2E8F0; --border: #1F2937; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 2rem; }
        .container { max-width: 1000px; margin: 0 auto; }
        table { width: 100%; border-collapse: collapse; background: #151921; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #1F2937; color: var(--gold); }
        .hit { color: #4ade80; font-weight: bold; }
        .flop { color: #f87171; font-weight: bold; }
        .nav-links a { color: #38BDF8; text-decoration: none; margin-left: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <nav style="display:flex; justify-content:space-between; margin-bottom:2rem;">
            <h1 style="color:white;">TeluguCineCraft</h1>
            <div class="nav-links"><a href="index.html">Movies</a></div>
        </nav>

        <div id="content">Loading Box Office Data...</div>
    </div>

    <script>
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient(
                "https://eosgvjvpdwxmpxzerxit.supabase.co", 
                "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx"
            );
        }
        const db = window.myFixedClient;

        async function init() {
            const { data, error } = await db.from('box_office').select('*');
            
            if (error || !data) {
                document.getElementById('content').innerHTML = "<h1>Error loading data</h1>";
                return;
            }

            let html = `<table><tr><th>Movie</th><th>Budget</th><th>Collection</th><th>Verdict</th></tr>`;
            
            data.forEach(m => {
                const verdictClass = m.verdict?.toLowerCase().includes('hit') ? 'hit' : 'flop';
                html += `<tr>
                    <td><a href="movie.html?id=${m.movie_id}" style="color:#38BDF8; text-decoration:none;">${m.movie_name}</a></td>
                    <td>${m.budget || '-'}</td>
                    <td>${m.collection || '-'}</td>
                    <td class="${verdictClass}">${m.verdict || '-'}</td>
                </tr>`;
            });
            
            html += `</table>`;
            document.getElementById('content').innerHTML = html;
        }
        init();
    </script>
</body>
</html>
