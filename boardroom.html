<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- Admitad Verification Code -->
    <meta name="verify-admitad" content="3b27ad383c" />
    
    <title>Producer & Studio Board Room | TeluguCineCraft Executive Terminal</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Supabase JS Client v2 & Shared App Logic -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>

    <style>
        :root {
            --bg-base: #040609;
            --bg-glass: rgba(12, 17, 26, 0.9);
            --bg-card: rgba(18, 24, 38, 0.75);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 199, 0, 0.4);
            --gold-accent: #FFC700;
            --gold-glow: rgba(255, 199, 0, 0.15);
            --cyan-accent: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --danger: #EF4444;
            --success: #22C55E;
            --exec-purple: #8B5CF6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 50% 0%, rgba(255, 199, 0, 0.02) 0%, transparent 50%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .container { max-width: 1450px; margin: 0 auto; }

        /* Executive Nav */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.8rem; background: var(--bg-glass);
            backdrop-filter: blur(20px); border: 1px solid var(--border-glass); 
            border-radius: 16px; margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .brand-title { font-size: 1.3rem; font-weight: 900; color: #FFF; display: flex; align-items: center; gap: 10px; text-decoration: none;}
        .brand-title i { color: var(--gold-accent); }
        .executive-badge { background: rgba(255,199,0,0.1); border: 1px solid var(--gold-accent); color: var(--gold-accent); font-size: 0.7rem; font-weight: 800; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px;}
        
        .nav-actions { display: flex; align-items: center; gap: 15px; }
        .back-btn { color: var(--text-muted); text-decoration: none; font-weight: 700; font-size: 0.8rem; transition: color 0.2s; background: rgba(255,255,255,0.03); padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid var(--border-glass); text-transform: uppercase;}
        .back-btn:hover { color: #FFF; background: rgba(255,255,255,0.08); }

        .spectate-toggle-btn { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); color: var(--cyan-accent); padding: 0.5rem 1rem; border-radius: 8px; font-weight: 800; font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; gap: 6px; text-transform: uppercase; transition: all 0.2s;}
        .spectate-toggle-btn:hover, .spectate-toggle-btn.active { background: var(--cyan-accent); color: #000; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }

        .boardroom-grid { display: grid; grid-template-columns: 320px 1fr; gap: 1.5rem; align-items: start; }

        .studio-card {
            background: var(--bg-card); border: 1px solid var(--border-glass);
            border-radius: 18px; padding: 1.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .studio-title { font-size: 1rem; font-weight: 900; color: #FFF; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.8rem;}
        
        .metric-row { display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 0; border-bottom: 1px dashed rgba(255,255,255,0.05); }
        .metric-label { font-size: 0.75rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }
        .metric-val { font-size: 0.9rem; font-weight: 900; color: var(--gold-accent); }

        .main-workspace { display: flex; flex-direction: column; gap: 1.5rem; }
        .workspace-section { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 18px; padding: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.4); }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.8rem;}
        .section-title { font-size: 1.1rem; font-weight: 900; color: #FFF; display: flex; align-items: center; gap: 8px;}
        .section-action { font-size: 0.75rem; color: var(--cyan-accent); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;}

        .fan-pulse-drawer { background: rgba(56, 189, 248, 0.05); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 14px; padding: 1.2rem; margin-bottom: 1.5rem; display: none; }
        .fan-pulse-drawer.visible { display: block; animation: fadeIn 0.3s ease; }
        .pulse-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-top: 10px; }
        .pulse-card { background: rgba(0,0,0,0.4); padding: 0.8rem; border-radius: 10px; border: 1px solid var(--border-glass); text-align: center; }
        .pulse-title { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
        .pulse-val { font-size: 1rem; font-weight: 900; color: var(--cyan-accent); }

        .script-card { background: rgba(0,0,0,0.4); border: 1px solid var(--border-glass); border-radius: 14px; padding: 1.2rem; margin-bottom: 1rem; transition: border-color 0.2s; }
        .script-card:hover { border-color: rgba(255, 199, 0, 0.3); }
        .script-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
        .script-name { font-size: 1.05rem; font-weight: 900; color: #FFF; }
        .script-meta { font-size: 0.75rem; color: var(--text-muted); display: flex; gap: 15px; margin-bottom: 10px; font-weight: 600;}
        .script-logline { font-size: 0.85rem; color: #CBD5E1; line-height: 1.4; margin-bottom: 12px; font-weight: 500;}
        
        .script-actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-glass); padding-top: 10px;}
        .script-stats { display: flex; gap: 15px; font-size: 0.75rem; color: var(--text-muted); font-weight: 700;}
        .script-stats i { color: var(--gold-accent); margin-right: 4px; }
        
        .action-btn-group { display: flex; gap: 8px; }
        .btn-like { background: rgba(255,255,255,0.05); border: 1px solid var(--border-glass); color: #FFF; padding: 0.4rem 0.8rem; border-radius: 8px; font-weight: 800; font-size: 0.75rem; cursor: pointer; }
        .btn-like:hover { background: rgba(255,255,255,0.1); }
        .btn-lock { background: linear-gradient(135deg, var(--gold-accent), #E6B300); color: #000; border: none; padding: 0.4rem 1rem; border-radius: 8px; font-weight: 900; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; box-shadow: 0 4px 12px rgba(255,199,0,0.2);}
        .btn-lock:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(255,199,0,0.4); }

        /* Security Gate Styles */
        .access-gate { text-align: center; padding: 4rem 2rem; background: var(--bg-card); border: 1px dashed var(--gold-accent); border-radius: 20px; max-width: 650px; margin: 3rem auto; box-shadow: 0 15px 40px rgba(0,0,0,0.7); }
        .access-gate i { font-size: 3rem; color: var(--gold-accent); margin-bottom: 15px; filter: drop-shadow(0 0 15px var(--gold-glow)); }

        .accreditation-form { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 20px; padding: 2.5rem; max-width: 550px; margin: 2rem auto; box-shadow: 0 15px 40px rgba(0,0,0,0.8); text-align: left; }
        .form-group { margin-bottom: 1.2rem; }
        .form-label { display: block; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; margin-bottom: 6px; letter-spacing: 0.5px;}
        .form-input { width: 100%; background: rgba(0,0,0,0.5); border: 1px solid var(--border-glass); border-radius: 10px; padding: 0.8rem 1rem; color: #FFF; font-family: inherit; font-size: 0.9rem; outline: none; transition: border-color 0.2s;}
        .form-input:focus { border-color: var(--gold-accent); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 1024px) { .boardroom-grid { grid-template-columns: 1fr; } .pulse-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container" id="mainContainer">
        
        <!-- NAV BAR -->
        <nav>
            <div style="display:flex; align-items:center; gap:12px;">
                <a href="index.html" class="brand-title"><i class="fa-solid fa-briefcase"></i> Producer Board Room</a>
                <span class="executive-badge">Secure Terminal v3.2</span>
            </div>
            <div class="nav-actions" id="navActionsArea">
                <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Exit</a>
            </div>
        </nav>

        <!-- DYNAMIC CONTENT AREA -->
        <div id="boardroomContent">
            <div style="text-align:center; padding: 4rem; color:var(--text-muted);">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color:var(--gold-accent)"></i>
                <p style="margin-top:15px; font-weight:700;">Verifying Secure Studio Clearance...</p>
            </div>
        </div>

    </div>

    <script>
        let globalUser = null;
        let isSpectateActive = false;

        async function verifyStudioAccess() {
            try {
                const { data: { user }, error: authError } = await db.auth.getUser();
                if (authError) throw authError;
                
                globalUser = user;
                const container = document.getElementById('boardroomContent');

                if (!user) {
                    // SECURITY WALL: Not signed in
                    container.innerHTML = `
                        <div class="access-gate">
                            <i class="fa-solid fa-shield-halved"></i>
                            <h2 style="color:#FFF; font-size:1.6rem; font-weight:900; margin-bottom:10px;">Executive Clearance Required</h2>
                            <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:25px; line-height:1.5;">The Producer Board Room is restricted exclusively to verified Tollywood Producers and Directors. Secure Google or iCloud identity verification is required to proceed.</p>
                            <button class="btn-lock" style="padding: 0.9rem 2.5rem; font-size:0.9rem;" onclick="handleGoogleLogin()">
                                <i class="fa-brands fa-google" style="margin-right:8px;"></i> Authenticate & Request Access
                            </button>
                        </div>
                    `;
                    return;
                }

                // Safe fetch: Gets the latest approval record without crashing on multi-rows
                const { data: records, error } = await db
                    .from('studio_approvals')
                    .select('*')
                    .eq('user_id', user.id)
                    .order('created_at', { ascending: false });

                const approvalRecord = records && records.length > 0 ? records[0] : null;

                if (error || !approvalRecord) {
                    renderAccreditationForm(user);
                    return;
                }

                if (approvalRecord.status === 'pending') {
                    container.innerHTML = `
                        <div class="access-gate" style="border-color: rgba(56, 189, 248, 0.3);">
                            <div style="font-size: 0.7rem; letter-spacing: 2px; color: var(--cyan-accent); font-weight: 800; text-transform: uppercase; margin-bottom: 8px;">
                                [ PROTOCOL 04: CREDENTIAL AUDIT ]
                            </div>
                            <h2 style="color:#FFF; font-size: 1.25rem; font-weight: 900; margin-bottom: 6px; text-transform: uppercase;">
                                Security Clearance: Pending Verification
                            </h2>
                            <div style="font-size: 0.8rem; color: var(--gold-accent); font-weight: 700; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.5px;">
                                Entity: ${approvalRecord.studio_name} (${approvalRecord.role})
                            </div>
                            
                            <div style="background: rgba(0,0,0,0.6); border: 1px solid var(--border-glass); border-radius: 12px; padding: 1.8rem; text-align: left; margin-bottom: 24px;">
                                <p style="color: var(--text-muted); font-size: 0.88rem; line-height: 1.6; font-weight: 500; margin-bottom: 16px;">
                                    Your executive dossier has been securely logged with the TeluguCineCraft Executive Committee. Per compliance mandates for Producers and Directors, manual identity and firm-surety verification is required before granting access to proprietary script ledgers and trade telemetry.
                                </p>
                                <div style="border-top: 1px solid rgba(255,255,255,0.06); padding-top: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem;">
                                    <span style="color: #64748B; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;">Status: Under Review</span>
                                    <span style="color: var(--cyan-accent); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">Resolution: Within 4 Business Days</span>
                                </div>
                            </div>
                            <button class="back-btn" onclick="signOutUser()" style="margin: 0 auto; display: inline-flex; font-size: 0.75rem; letter-spacing: 0.5px;">
                                Switch Profile / Sign Out
                            </button>
                        </div>
                    `;
                    return;
                }

                if (approvalRecord.status === 'rejected') {
                    container.innerHTML = `
                        <div class="access-gate" style="border-color: rgba(239, 68, 68, 0.4); max-width: 650px; background: rgba(12, 17, 26, 0.95);">
                            <div style="font-size: 0.7rem; letter-spacing: 2px; color: var(--danger); font-weight: 800; text-transform: uppercase; margin-bottom: 8px;">
                                [ PROTOCOL 04: AUDIT FAILED ]
                            </div>
                            <h2 style="color:#FFF; font-size: 1.25rem; font-weight: 900; margin-bottom: 6px; text-transform: uppercase; letter-spacing: -0.2px;">
                                Accreditation Status: Verification Failure
                            </h2>
                            <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 700; margin-bottom: 24px; text-transform: uppercase; letter-spacing: 0.5px;">
                                Entity: ${approvalRecord.studio_name} (${approvalRecord.role})
                            </div>
                            
                            <div style="background: rgba(0,0,0,0.6); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px; padding: 1.8rem; text-align: left; margin-bottom: 24px;">
                                <p style="color: var(--text-muted); font-size: 0.88rem; line-height: 1.6; font-weight: 500; margin-bottom: 16px;">
                                    Your studio credentials could not be automatically authenticated against recognized Tollywood corporate registries or active production banners. 
                                </p>
                                <div style="border-top: 1px solid rgba(255,255,255,0.06); padding-top: 14px; font-size: 0.8rem; color: #FFF; font-weight: 700; line-height: 1.5;">
                                    <i class="fa-solid fa-headset" style="color: var(--cyan-accent); margin-right: 6px;"></i> 
                                    Action Required: Please contact the TeluguCineCraft Executive Committee support team to submit manual proof of firm-surety.
                                </div>
                            </div>
                            <button class="back-btn" onclick="signOutUser()" style="margin: 0 auto; display: inline-flex; font-size: 0.75rem; letter-spacing: 0.5px;">
                                Switch Profile / Sign Out
                            </button>
                        </div>
                    `;
                    return;
                }

                if (approvalRecord.status === 'approved') {
                    renderExecutiveTerminal(user);
                }

            } catch (err) {
                console.warn("Access verification error:", err);
            }
        }

        async function handleGoogleLogin() {
            await db.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
        }

        async function signOutUser() {
            await db.auth.signOut();
            window.location.reload();
        }

        function renderAccreditationForm(user) {
            const container = document.getElementById('boardroomContent');
            const defaultName = user.user_metadata.full_name || '';

            container.innerHTML = `
                <div class="accreditation-form">
                    <div style="text-align:center; margin-bottom: 1.5rem;">
                        <i class="fa-solid fa-id-card-clip fa-2x" style="color:var(--gold-accent); margin-bottom:8px;"></i>
                        <h2 style="color:#FFF; font-size:1.3rem; font-weight:900;">Executive Accreditation</h2>
                        <p style="color:var(--text-muted); font-size:0.8rem; margin-top:4px;">Restricted exclusively to verified Producers and Directors.</p>
                    </div>

                    <form id="accreditationForm" onsubmit="submitAccreditation(event)">
                        <div class="form-group">
                            <label class="form-label">Full Name</label>
                            <input type="text" id="accName" class="form-input" value="${defaultName}" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Studio / Banner / Production Firm Name</label>
                            <input type="text" id="accStudio" class="form-input" placeholder="e.g., Annapurna Studios / Mythri Movie Makers" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Executive Role</label>
                            <select id="accRole" class="form-input" required style="cursor: pointer;">
                                <option value="" disabled selected>Select your industry role...</option>
                                <option value="Producer">Producer / Studio Executive</option>
                                <option value="Director">Film Director / Showrunner</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Authenticated Google Email</label>
                            <input type="email" class="form-input" value="${user.email}" disabled style="opacity: 0.7; cursor: not-allowed;">
                        </div>
                        <button type="submit" class="btn-lock" style="width:100%; padding: 0.9rem; font-size:0.85rem; margin-top:10px;">
                            <i class="fa-solid fa-paper-plane" style="margin-right:6px;"></i> Submit for Admin Approval
                        </button>
                    </form>
                    
                    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px dashed var(--border-glass); text-align: center;">
                        <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px;">Are you a Scriptwriter looking to pitch a story?</p>
                        <a href="arena.html" style="color: var(--cyan-accent); font-size: 0.8rem; font-weight: 800; text-decoration: none;">
                            <i class="fa-solid fa-arrow-right"></i> Pitch securely via Fan Arena Launchpad
                        </a>
                    </div>

                    <div style="text-align:center; margin-top:15px;">
                        <button onclick="signOutUser()" style="background:none; border:none; color:var(--text-muted); font-size:0.75rem; cursor:pointer; text-decoration:underline;">Sign Out</button>
                    </div>
                </div>
            `;
        }

        async function submitAccreditation(event) {
            event.preventDefault();
            const fullName = document.getElementById('accName').value.trim();
            const studioName = document.getElementById('accStudio').value.trim();
            const role = document.getElementById('accRole').value.trim();

            if (!fullName || !studioName || !role) return;

            try {
                const { error } = await db.from('studio_approvals').insert({
                    user_id: globalUser.id,
                    email: globalUser.email,
                    full_name: fullName,
                    studio_name: studioName,
                    role: role,
                    status: 'pending'
                });

                if (error) throw error;

                alert("Accreditation request submitted! Status is now pending executive approval.");
                window.location.reload();
            } catch (err) {
                console.error("Submission error:", err);
                alert("Error submitting accreditation: " + err.message);
            }
        }

        function toggleSpectateMode() {
            isSpectateActive = !isSpectateActive;
            const drawer = document.getElementById('fanPulseDrawer');
            const btn = document.getElementById('spectateBtn');
            if (drawer) {
                if (isSpectateActive) {
                    drawer.classList.add('visible');
                    btn.classList.add('active');
                    btn.innerHTML = `<i class="fa-solid fa-eye-slash"></i> Hide Fan Pulse`;
                } else {
                    drawer.classList.remove('visible');
                    btn.classList.remove('active');
                    btn.innerHTML = `<i class="fa-solid fa-eye"></i> Spectate Fan Pulse`;
                }
            }
        }

        function renderExecutiveTerminal(user) {
            const container = document.getElementById('boardroomContent');
            let shortEmail = user.email ? user.email.split('@')[0] : 'Executive';

            document.getElementById('navActionsArea').innerHTML = `
                <button class="spectate-toggle-btn" id="spectateBtn" onclick="toggleSpectateMode()">
                    <i class="fa-solid fa-eye"></i> Spectate Fan Pulse
                </button>
                <button class="back-btn" onclick="signOutUser()" title="Sign Out"><i class="fa-solid fa-right-from-bracket"></i></button>
            `;

            container.innerHTML = `
                <!-- FAN PULSE SPECTATOR DRAWER -->
                <div class="fan-pulse-drawer" id="fanPulseDrawer">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
                        <span style="font-size:0.8rem; font-weight:900; color:var(--cyan-accent); text-transform:uppercase; letter-spacing:1px;">
                            <i class="fa-solid fa-tower-broadcast"></i> Live Ground-Level Hype Telemetry (Fan Arena Feed)
                        </span>
                        <span style="font-size:0.7rem; color:var(--success); font-weight:800;">● Active Stream</span>
                    </div>
                    <div class="pulse-grid">
                        <div class="pulse-card">
                            <div class="pulse-title">Top Trending Fan Base</div>
                            <div class="pulse-val" style="color:var(--gold-accent);">Prabhas Army (34%)</div>
                        </div>
                        <div class="pulse-card">
                            <div class="pulse-title">Day-1 Sentiment Index</div>
                            <div class="pulse-val">88% Positive (Uncorrupted)</div>
                        </div>
                        <div class="pulse-card">
                            <div class="pulse-title">Nizam Advance Velocity</div>
                            <div class="pulse-val" style="color:var(--success);">+42% vs Season Avg</div>
                        </div>
                    </div>
                </div>

                <div class="boardroom-grid">
                    
                    <!-- LEFT: CONSOLE & MACRO METRICS -->
                    <div class="studio-card">
                        <div class="studio-title"><i class="fa-solid fa-chart-pie" style="color:var(--gold-accent)"></i> Studio Telemetry</div>
                        
                        <div class="metric-row">
                            <span class="metric-label">Active Executive</span>
                            <span class="metric-val" style="color:#FFF;">${shortEmail}</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Vetted IP Pool</span>
                            <span class="metric-val">28 Loglines</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">NDA Compliance</span>
                            <span class="metric-val" style="color:var(--success);">Active (256-bit)</span>
                        </div>
                        <div class="metric-row">
                            <span class="metric-label">Platform Status</span>
                            <span class="metric-val" style="color:var(--cyan-accent);">Jio-Tier Free Access</span>
                        </div>

                        <div style="margin-top: 1.5rem; padding: 1rem; background: rgba(139, 92, 246, 0.05); border: 1px solid rgba(139, 92, 246, 0.2); border-radius: 12px;">
                            <div style="font-size:0.75rem; font-weight:900; color:var(--exec-purple); margin-bottom:4px; text-transform:uppercase;">
