<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Directory Diagnostic</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0B0E14; color: #fff; font-family: sans-serif; padding: 2rem; }
        .card { background: #151921; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #1F2937; }
        .debug { background: #7f1d1d; padding: 20px; border-radius: 8px; color: #fecaca; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div id="content">Loading...</div>

    <script>
        // 1. SAFE INITIALIZATION
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient(
                "https://eosgvjvpdwxmpxzerxit.supabase.co", 
                "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx"
            );
        }
        const db = window.myFixedClient;

        // 2. DIAGNOSTIC DEBUGGER
        const params = new URLSearchParams(window.location.search);
        const talentName = params.get('name');
        const role = params.get('role');

        async function init() {
            // If data is missing, show the debug info instead of "Invalid Request"
            if (!talentName || !role) {
                document.getElementById('content').innerHTML = `
                    <div class="debug">
                        <h1>Debug Mode: Missing Parameters</h1>
                        <p>The system could not find the required data in your URL.</p>
                        <p><strong>Detected Name:</strong> ${talentName}</p>
                        <p><strong>Detected Role:</strong> ${role}</p>
                        <hr>
                        <p>This means your link generation in <code>movie.html</code> is likely broken.</p>
                    </div>
                `;
                return;
            }

            // 3. MAIN LOGIC (Only runs if params exist)
            const { data, error } = await db.from('box_office').select('*');
            
            if (error || !data) {
                document.getElementById('content').innerHTML = "<h1>Data Load Error</h1>";
                return;
            }

            const cleanName = decodeURIComponent(talentName).toLowerCase();
            const films = data.filter(m => {
                let target = "";
                if (role === 'hero') target = m.starring || "";
                else if (role === 'director') target = m.director || "";
                else if (role === 'music') target = m.music_director || "";
                return target.toLowerCase().includes(cleanName);
            });

            document.getElementById('content').innerHTML = `
                <h1>${talentName.toUpperCase()}</h1>
                <p>Role: ${role.toUpperCase()} | Total: ${films.length}</p>
                ${films.map(f => `
                    <div class="card" onclick="location.href='movie.html?id=${f.movie_id}'" style="cursor:pointer">
                        ${f.movie_name}
                    </div>
                `).join('')}
            `;
        }
        init();
    </script>
</body>
</html>
