<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft | Technician Profile & Talent Review</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
        :root {
            --bg-color: #0B0F19;
            --card-bg: #1E293B;
            --accent-gold: #FBBF24;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --border-color: #334155;
            --badge-blue: #38BDF8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        nav {
            width: 100%;
            background-color: #0F172A;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
        }

        .nav-logo {
            color: var(--accent-gold);
            font-size: 1.4rem;
            font-weight: bold;
            text-decoration: none;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 2rem 0;
        }

        .back-link {
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 1rem;
        }

        .profile-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        .profile-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #0F172A;
            border: 2px solid var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: var(--accent-gold);
            flex-shrink: 0;
        }

        .profile-info h1 {
            margin: 0 0 0.4rem 0;
            color: var(--accent-gold);
            font-size: 2rem;
        }

        .craft-tag {
            display: inline-block;
            background-color: rgba(251, 191, 36, 0.15);
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 0.8rem;
        }

        .section-title {
            font-size: 1.2rem;
            color: var(--accent-gold);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.5rem;
        }

        .card-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }

        .film-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .film-title {
            color: var(--text-main);
            font-weight: 600;
            text-decoration: none;
        }

        textarea {
            width: 100%;
            background-color: #0F172A;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            box-sizing: border-box;
            resize: vertical;
            min-height: 70px;
            margin-top: 1rem;
            outline: none;
        }

        .btn-submit {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.8rem;
        }

        .review-item {
            background-color: #0F172A;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 0.8rem;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-logo">TeluguCineCraft</a>
    </nav>

    <div class="container">
        <a href="technicians.html" class="back-link">← Back to Talent Directory</a>

        <div class="profile-card" id="profileCard">
            <div class="profile-avatar">🎬</div>
            <div class="profile-info">
                <h1>Loading...</h1>
            </div>
        </div>

        <!-- Verified Filmography -->
        <div class="card-box">
            <div class="section-title">Verified TFI Credits</div>
            <div id="filmList"><p style="color:var(--text-sub);">Loading credits...</p></div>
        </div>

        <!-- Direct Industry Review Box -->
        <div class="card-box">
            <div class="section-title">Submit Craft Review for Production & Casting Consideration</div>
            <textarea id="crewReviewText" placeholder="Write a technical note regarding this technician's craft performance, efficiency, or potential for future projects..."></textarea>
            <button class="btn-submit" onclick="submitCrewReview()">Post Craft Endorsement</button>
        </div>

        <!-- Community & Producer Reviews -->
        <div class="card-box">
            <div class="section-title">Verified Industry & Audience Reviews</div>
            <div id="reviewsList"><p style="color:var(--text-sub);">Loading reviews...</p></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://eosgvjvpdwxmpxzerxit.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx";
        let supabaseClient;

        const urlParams = new URLSearchParams(window.location.search);
        const techId = urlParams.get('id') || 'buchi-babu';

        document.addEventListener("DOMContentLoaded", async function() {
            if (typeof supabase !== 'undefined') {
                const { createClient } = supabase;
                supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                loadProfile();
                loadReviews();
            }
        });

        async function loadProfile() {
            const { data: tech } = await supabaseClient.from('technicians').select('*').eq('id', techId).single();
            const { data: movies } = await supabaseClient.from('movies').select('*');

            const profileCard = document.getElementById('profileCard');
            const filmList = document.getElementById('filmList');

            if (!tech) {
                profileCard.innerHTML = `<h1>Technician Not Found</h1>`;
                return;
            }

            profileCard.innerHTML = `
                <div class="profile-avatar">🎥</div>
                <div class="profile-info">
                    <h1>${tech.name}</h1>
                    <span class="craft-tag">${tech.craft}</span>
                    <p style="color:var(--text-sub); margin:0;">${tech.bio || 'Verified TFI Crew Member.'}</p>
                </div>
            `;

            const creditedMovies = movies ? movies.filter(m => 
                (m.director && m.director.toLowerCase().includes(tech.name.toLowerCase())) ||
                (m.starring && m.starring.toLowerCase().includes(tech.name.toLowerCase()))
            ) : [];

            if (creditedMovies.length === 0) {
                filmList.innerHTML = `<p style="color:var(--text-sub);">No verified filmography linked yet.</p>`;
            } else {
                filmList.innerHTML = creditedMovies.map(m => `
                    <div class="film-row">
                        <a href="movie.html?id=${m.id}" class="film-title">${m.title}</a>
                        <span style="color:var(--accent-gold); font-weight:bold;">${m.ww_gross || 'TBD'}</span>
                    </div>
                `).join('');
            }
        }

        async function loadReviews() {
            const { data: reviews } = await supabaseClient.from('crew_reviews').select('*').eq('technician_id', techId);
            const reviewsList = document.getElementById('reviewsList');

            if (reviews && reviews.length > 0) {
                reviewsList.innerHTML = reviews.map(r => `
                    <div class="review-item">
                        <p style="margin:0; font-size:0.95rem;">"${r.review_text}"</p>
                        <span style="font-size:0.75rem; color:var(--text-sub); display:block; margin-top:6px;">— Industry Craft Note</span>
                    </div>
                `).join('');
            } else {
                reviewsList.innerHTML = `<p style="color:var(--text-sub);">No craft reviews posted yet. Be the first to endorse!</p>`;
            }
        }

        async function submitCrewReview() {
            const text = document.getElementById('crewReviewText').value;
            if (!text.trim()) {
                alert("Please enter a review note.");
                return;
            }

            const { error } = await supabaseClient.from('crew_reviews').insert([
                { technician_id: techId, review_text: text, rating: 5.0 }
            ]);

            if (error) {
                alert("Error submitting review: " + error.message);
            } else {
                alert("Craft review posted!");
                document.getElementById('crewReviewText').value = '';
                loadReviews();
            }
        }
    </script>
</body>
</html>
