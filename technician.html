<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Directory</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0B0E14; --card: #151921; --gold: #FFD700; --text: #E2E8F0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding: 2rem; }
        .container { max-width: 800px; margin: 0 auto; }
        .profile-title { color: var(--gold); font-size: 2rem; margin-bottom: 1.5rem; }
        .movie-list { display: grid; gap: 0.8rem; }
        .movie-item { background: var(--card); padding: 1rem; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .movie-item:hover { background: #1E293B; }
    </style>
</head>
<body>
    <div class="container" id="content">Loading Talent...</div>
    <script>
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient("https://eosgvjvpdwxmpxzerxit.supabase.co", "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx");
        }
        const db = window.myFixedClient;
        const talentName = decodeURIComponent(new URLSearchParams(window.location.search).get('name') || '').toLowerCase();

        async function init() {
            const { data } = await db.from('box_office').select('*');
            const films = (data || []).filter(m => [m.director, m.producer, m.starring].join(',').toLowerCase().includes(talentName));
            
            document.getElementById('content').innerHTML = `
                <h1 class="profile-title">${talentName.toUpperCase()}</h1>
                <div class="movie-list">
                    ${films.map(f => `<div class="movie-item" onclick="location.href='movie.html?id=${f.movie_id}'">${f.movie_name}</div>`).join('')}
                </div>
            `;
        }
        init();
    </script>
</body>
</html>
