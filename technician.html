<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Directory</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #0B0E14; color: #fff; font-family: sans-serif; padding: 2rem; }
        .card { background: #151921; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #1F2937; }
        h1 { color: #FFD700; }
    </style>
</head>
<body>
    <div id="content">Loading Talent...</div>
    <script>
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient("https://eosgvjvpdwxmpxzerxit.supabase.co", "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx");
        }
        const db = window.myFixedClient;
        const searchName = decodeURIComponent(new URLSearchParams(window.location.search).get('name') || '').toLowerCase();

        // Normalization: Removes dots/spaces for fuzzy matching
        const normalize = (n) => n.toLowerCase().replace(/[^a-z]/g, '');

        async function init() {
            const { data } = await db.from('box_office').select('*');
            
            // Deduplication logic: Keep only unique movie objects
            const films = (data || []).filter(m => {
                const crewArr = [m.director, m.producer, m.starring, m.supporting_cast].join(',').split(',');
                return crewArr.some(n => normalize(n).includes(normalize(searchName)));
            });

            document.getElementById('content').innerHTML = `
                <h1>${searchName.toUpperCase()}</h1>
                <p>Total Credits: ${films.length}</p>
                ${films.map(f => `<div class="card" onclick="location.href='movie.html?id=${f.movie_id}'" style="cursor:pointer">
                    <div style="font-size:1.2rem;">${f.movie_name}</div>
                </div>`).join('')}
            `;
        }
        init();
    </script>
</body>
</html>
