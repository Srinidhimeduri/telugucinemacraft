<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talent Directory</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #070B14; color: #fff; font-family: sans-serif; padding: 2rem; }
        .card { background: #111827; padding: 15px; border-radius: 8px; margin: 10px 0; border: 1px solid #1F2937; }
    </style>
</head>
<body>
    <div id="content">Loading Talent...</div>
    <script>
        // Force-refreshing the client variable to bypass cache
        if (!window.myFixedClient) {
            window.myFixedClient = window.supabase.createClient("https://eosgvjvpdwxmpxzerxit.supabase.co", "sb_publishable_FVXC4U8wUB2l1SmWLpmoeg_4RkydeLx");
        }
        const db = window.myFixedClient;
        const talentName = decodeURIComponent(new URLSearchParams(window.location.search).get('name') || '').toLowerCase();

        async function init() {
            const { data } = await db.from('box_office').select('*');
            if (!data) return;

            const films = data.filter(m => {
                const crew = [m.director, m.producer, m.starring, m.supporting_cast].join(',').toLowerCase();
                return crew.includes(talentName);
            });

            if (films.length === 0) {
                document.getElementById('content').innerHTML = `<h1>No films found for "${talentName}"</h1>`;
            } else {
                document.getElementById('content').innerHTML = `
                    <h1>${talentName.toUpperCase()}</h1>
                    ${films.map(f => `<div class="card">
                        <div style="font-size:1.2rem; color:#FBBF24;">${f.movie_name}</div>
                        <div>${f.verdict || 'N/A'}</div>
                    </div>`).join('')}
                `;
            }
        }
        init();
    </script>
</body>
</html>
