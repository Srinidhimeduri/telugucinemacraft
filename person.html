<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft | Individual Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-base: #06080C;
            --bg-glass: rgba(18, 24, 38, 0.75);
            --bg-card: rgba(26, 34, 52, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 199, 0, 0.4);
            --gold-accent: #FFC700;
            --cyan-accent: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --danger: #EF4444;
            --success: #22C55E;
            --purple-accent: #C084FC;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(circle at 15% 10%, rgba(255, 199, 0, 0.05) 0%, transparent 40%), radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.04) 0%, transparent 40%);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            padding: 1.2rem;
        }

        .container { max-width: 1250px; margin: 0 auto; width: 100%; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 1.6rem; background: var(--bg-glass); backdrop-filter: blur(16px); border: 1px solid var(--border-glass); border-radius: 16px; margin-bottom: 1.2rem; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
        .brand-title { font-size: 1.4rem; font-weight: 800; color: #FFF; text-decoration: none; }
        .back-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-glass); color: var(--text-main); padding: 0.55rem 1.2rem; border-radius: 10px; cursor: pointer; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s ease; }
        .back-btn:hover { border-color: var(--gold-accent); color: var(--gold-accent); }

        .profile-header { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 18px; padding: 2rem; display: flex; align-items: center; gap: 2rem; margin-bottom: 1.2rem; position: relative; overflow: hidden; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4); }
        .profile-header::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--gold-accent); box-shadow: 0 0 20px var(--gold-accent); }
        .profile-avatar { width: 100px; height: 100px; border-radius: 50%; background: rgba(255, 255, 255, 0.05); border: 2px dashed var(--gold-accent); display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: var(--gold-accent); }
        .profile-name { font-size: 2.5rem; font-weight: 800; }
        .profile-role { font-size: 0.9rem; color: var(--cyan-accent); text-transform: uppercase; font-weight: 800; }

        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2rem; margin-bottom: 1.2rem; }
        .metric-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 16px; padding: 1.4rem; text-align: center; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3); }
        .metric-title { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; font-weight: 700; }
        .metric-value { font-size: 1.8rem; font-weight: 800; color: #FFF; }
        .metric-value.gold { color: var(--gold-accent); }
        .metric-value.cyan { color: var(--cyan-accent); }

        .timeline-container { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 18px; padding: 2rem; }
        .timeline-header { font-size: 1.2rem; font-weight: 800; color: var(--cyan-accent); margin-bottom: 1.5rem; }
        
        .movie-table-header { display: grid; gap: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border-glass); font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
        .movie-row { display: grid; gap: 1rem; align-items: center; padding: 1rem 0.5rem; border-bottom: 1px dashed rgba(255, 255, 255, 0.05); }
        .m-year { font-weight: 800; color: var(--text-muted); }
        .m-title-block { display: flex; flex-direction: column; gap: 4px; }
        .m-title { font-size: 1.05rem; font-weight: 700; color: #FFF; text-decoration: none; }
        .m-title:hover { color: var(--gold-accent); }
        
        .genre-badge { background: rgba(56, 189, 248, 0.1); color: var(--cyan-accent); border: 1px solid rgba(56, 189, 248, 0.2); padding: 0.15rem 0.6rem; border-radius: 6px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; display: inline-block; margin-right: 4px; }
        
        .movie-award-badge { background: rgba(255, 199, 0, 0.12); color: var(--gold-accent); border: 1px solid rgba(255, 199, 0, 0.4); padding: 0.35rem 0.7rem; border-radius: 8px; font-size: 0.75rem; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }

        @media (max-width: 768px) { .profile-header { flex-direction: column; text-align: center; } .movie-row { grid-template-columns: 1fr !important; } }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="index.html" class="brand-title"><i class="fa-solid fa-film"></i> TeluguCineCraft</a>
            <a href="javascript:history.back()" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>
        </nav>
        <div id="profileArea" class="loading-view">Loading...</div>
    </div>

    <script>
        const db = window.supabase.createClient(
            "https://eosgvjvpdwxmpxzerxit.supabase.co", 
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc2d2anZwZHd4bXB4emVyeGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Njk3MTMsImV4cCI6MjEwMTE0NTcxM30.fD14BdJBDPNqFUKGxS5DRgsDnN8CqYdWR4k8cuAbvcg"
        );

        function getPersonName() { return new URLSearchParams(window.location.search).get('name'); }

        async function loadProfile() {
            const name = getPersonName();
            if (!name) return;

            const cleanName = name.trim().replace(/'/g, "''");
            const { data: movies, error } = await db.from('movies').select('*').or(`hero.ilike.%${cleanName}%,director.ilike.%${cleanName}%`);

            if (!movies || movies.length === 0) {
                document.getElementById('profileArea').innerHTML = "No records found.";
                return;
            }

            // UI Render
            const timelineHtml = movies.map(m => {
                const year = (m.release_date || m.year || 'TBA').toString().substring(0,4);
                const genres = m.genre ? m.genre.split(',').slice(0, 2).map(g => `<span class="genre-badge">${g.trim()}</span>`).join('') : '';
                
                return `
                <div class="movie-row" style="grid-template-columns: 80px 2.5fr 1.5fr;">
                    <div class="m-year">${year}</div>
                    <div class="m-title-block">
                        <a href="movie.html?id=${m.movie_id || m.id}" class="m-title">${m.movie_name || m.title}</a>
                        <div>${genres}</div>
                    </div>
                    <div class="m-gross" style="color:var(--gold-accent); font-weight:700;">${m.collection || 'TBA'}</div>
                </div>`;
            }).join('');

            document.getElementById('profileArea').innerHTML = `
                <div class="profile-header">
                    <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
                    <div>
                        <div class="profile-name">${name}</div>
                        <div class="profile-role"><i class="fa-solid fa-star"></i> Cinematic Artist</div>
                    </div>
                </div>
                <div class="timeline-container">
                    <div class="timeline-header"><i class="fa-solid fa-clapperboard"></i> Filmography</div>
                    <div class="movie-table-header" style="grid-template-columns: 80px 2.5fr 1.5fr;">
                        <div>Year</div> <div>Movie Title</div> <div>Gross</div>
                    </div>
                    ${timelineHtml}
                </div>
            `;
        }

        loadProfile();
    </script>
</body>
</html>
