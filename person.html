<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeluguCineCraft | Individual Profile</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-base: #06080C;
            --bg-glass: rgba(18, 24, 38, 0.75);
            --bg-card: rgba(26, 34, 52, 0.6);
            --border-glass: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(255, 199, 0, 0.4);
            --gold-accent: #FFC700;
            --cyan-accent: #38BDF8;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --danger: #EF4444;
            --success: #22C55E;
        }

        body { background-color: var(--bg-base); color: var(--text-main); font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; padding: 1.2rem; }
        .container { max-width: 1350px; margin: 0 auto; width: 100%; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 1.6rem; background: var(--bg-glass); backdrop-filter: blur(16px); border: 1px solid var(--border-glass); border-radius: 16px; margin-bottom: 1.2rem; }
        .brand-title { font-size: 1.4rem; font-weight: 800; color: #FFF; text-decoration: none; }
        
        .profile-header { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 18px; padding: 2rem; display: flex; align-items: center; justify-content: space-between; gap: 2rem; margin-bottom: 1.2rem; position: relative; overflow: hidden; }
        .profile-header::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--gold-accent); }
        .profile-name { font-size: 2.5rem; font-weight: 800; }
        .ceo-insight-box { background: rgba(255, 199, 0, 0.06); border: 1px solid rgba(255, 199, 0, 0.2); padding: 1rem 1.5rem; border-radius: 12px; text-align: right; }
        .ceo-insight-val { font-size: 1.15rem; font-weight: 800; color: #FFF; }

        .metrics-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; margin-bottom: 1.2rem; }
        .metric-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 16px; padding: 1.4rem; text-align: center; }
        .metric-title { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
        .metric-value { font-size: 1.5rem; font-weight: 800; color: #FFF; }

        .timeline-container { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 18px; padding: 2rem; }
        .movie-table-header { display: grid; grid-template-columns: 80px 2.5fr 1fr 1.5fr; gap: 1rem; border-bottom: 1px solid var(--border-glass); padding-bottom: 0.5rem; color: var(--text-muted); font-size: 0.7rem; text-transform: uppercase; }
        .movie-row { display: grid; grid-template-columns: 80px 2.5fr 1fr 1.5fr; gap: 1rem; align-items: center; padding: 1rem 0.5rem; border-bottom: 1px dashed rgba(255, 255, 255, 0.05); }
        .genre-badge { background: rgba(56, 189, 248, 0.1); color: var(--cyan-accent); border: 1px solid rgba(56, 189, 248, 0.2); padding: 0.15rem 0.6rem; border-radius: 6px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; margin-right: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <nav><a href="index.html" class="brand-title"><i class="fa-solid fa-film"></i> TeluguCineCraft</a><a href="index.html" class="back-btn">Back</a></nav>
        <div id="profileArea" class="loading-view"><i class="fa-solid fa-spinner fa-spin"></i> Loading Intelligence...</div>
    </div>

    <script>
        const db = window.supabase.createClient("https://eosgvjvpdwxmpxzerxit.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVvc2d2anZwZHd4bXB4emVyeGl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU1Njk3MTMsImV4cCI6MjEwMTE0NTcxM30.fD14BdJBDPNqFUKGxS5DRgsDnN8CqYdWR4k8cuAbvcg");

        async function loadProfile() {
            const name = new URLSearchParams(window.location.search).get('name');
            const cleanName = name.trim().replace(/'/g, "''");
            const { data: movies } = await db.from('movies').select('*').or(`hero.ilike.%${cleanName}%,director.ilike.%${cleanName}%`);

            if (!movies) return;

            let totalGross = 0, hits = 0, flops = 0, peakMovie = null, maxGross = 0;
            let genreMap = {}, directorFreq = {};

            movies.forEach(m => {
                const g = parseFloat((m.collection || '').replace(/[^0-9.]/g, '')) || 0;
                const b = parseFloat((m.budget || '').replace(/[^0-9.]/g, '')) || 0;
                totalGross += g;
                if (g > maxGross) { maxGross = g; peakMovie = m; }
                if (g >= b && b > 0) hits++; else if (b > 0) flops++;
                
                // Track Genre
                if (m.genre) m.genre.split(',').forEach(gen => { gen = gen.trim(); genreMap[gen] = (genreMap[gen] || 0) + 1; });
                // Track Director
                if (m.director) directorFreq[m.director] = (directorFreq[m.director] || 0) + 1;
            });

            const topGenre = Object.keys(genreMap).sort((a,b) => genreMap[b] - genreMap[a])[0];
            const topCollab = Object.keys(directorFreq).sort((a,b) => directorFreq[b] - directorFreq[a])[0];

            document.getElementById('profileArea').innerHTML = `
                <div class="profile-header">
                    <div style="display:flex; align-items:center; gap:1rem;">
                        <div class="profile-avatar"><i class="fa-solid fa-user"></i></div>
                        <div><div class="profile-name">${name}</div><div class="profile-role">Trade Analytics Profile</div></div>
                    </div>
                    <div class="ceo-insight-box">
                        <div class="metric-title">Industry Peak</div>
                        <div class="ceo-insight-val">${peakMovie ? peakMovie.movie_name : 'N/A'}</div>
                    </div>
                </div>

                <div class="metrics-grid">
                    <div class="metric-card"><div class="metric-title">Total Movies</div><div class="metric-value">${movies.length}</div></div>
                    <div class="metric-card"><div class="metric-title">Lifetime Gross</div><div class="metric-value gold">₹${totalGross} Cr</div></div>
                    <div class="metric-card"><div class="metric-title">Genre Dominance</div><div class="metric-value cyan">${topGenre || 'N/A'}</div></div>
                    <div class="metric-card"><div class="metric-title">Top Collaborator</div><div class="metric-value">${topCollab || 'N/A'}</div></div>
                </div>

                <div class="timeline-container">
                    <div class="timeline-header">Filmography Intelligence</div>
                    <div class="movie-table-header"><div>Year</div> <div>Movie</div> <div>Genre</div> <div>Gross</div></div>
                    ${movies.sort((a,b) => b.year - a.year).map(m => `
                        <div class="movie-row">
                            <div class="m-year">${m.year || 'TBA'}</div>
                            <a href="movie.html?id=${m.id}" class="m-title">${m.movie_name}</a>
                            <div>${m.genre ? m.genre.split(',').map(g => `<span class="genre-badge">${g.trim()}</span>`).join('') : ''}</div>
                            <div style="color:var(--gold-accent); font-weight:700;">${m.collection || 'TBA'}</div>
                        </div>
                    `).join('')}
                </div>
            `;
        }
        loadProfile();
    </script>
</body>
</html>
